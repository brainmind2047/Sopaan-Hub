function toast(t){ msg=t; const old=document.getElementById('toast'); if(old) old.remove(); if(!t) return; const d=document.createElement('div'); d.id='toast'; d.setAttribute('role','status'); d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#211E1A;color:#FBF9F4;padding:11px 18px;border-radius:99px;font-size:14.5px;z-index:95;max-width:92vw;text-align:center'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>{ if(msg===t){ d.remove(); msg=''; } },4500); }

/* ================= REFER A FRIEND (link from the monthly report; no sign-in) ================= */
function referView(){
  const top=`<header class="top"><div class="bar"><span class="brand"><span class="crest">S</span><span><span class="bt1">Brain &amp; Mind Academy</span><span class="bt2">Sopaan</span></span></span></div></header>`;

  else if(refDone) body=`<div class="card" style="text-align:center;padding:36px 24px"><div style="font-size:44px" aria-hidden="true">🎉</div><h1 style="font-size:30px;margin-top:6px">Thank you${refInfo.parent?', '+esc(refInfo.parent):''}!</h1><p style="color:var(--soft);font-size:16px;max-width:460px;margin:10px auto 0">We have your referral for <b>${esc(refDone)}</b>. Our team will get in touch with them soon.</p><button class="btn ghost" type="button" id="rfmore" style="margin-top:18px">Refer another friend</button></div>`;
  else body=`<form class="card" id="rfform" novalidate><span class="seclabel">Refer a friend</span><h1 style="font-size:30px;margin:6px 0 4px">Know a family who would enjoy Sopaan?</h1><p style="color:var(--soft);margin:0 0 6px">${refInfo.student?esc(refInfo.student)+' learns with us. ':''}Share a friend's details and our team will contact them.</p>
    <label class="l" for="rfp">Your name</label><input class="f" id="rfp" value="${esc(refInfo.parent)}" autocomplete="name">
    <label class="l" for="rfn">Friend's name</label><input class="f" id="rfn" required>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px"><div><label class="l" for="rfph">Friend's phone (with country code)</label><input class="f" id="rfph" type="tel" placeholder="+91 98765 43210"></div><div><label class="l" for="rfe">Friend's email</label><input class="f" id="rfe" type="email"></div></div>
    <label class="l" for="rfi">Interested in</label><select class="f" id="rfi"><option value="">Not sure yet</option>${(refInfo.groups||[]).map(g=>`<option>${esc(g)}</option>`).join('')}</select>
    <label class="l" for="rfm">Anything we should know? (optional)</label><textarea class="f" id="rfm" rows="3" placeholder="e.g. Grade 10, preparing for SAT next year"></textarea>
    <div id="rferr"></div><button class="btn" type="submit" style="margin-top:14px">Send referral</button></form>`;
  return top+`<div class="wrap" style="max-width:640px">${body}</div>`;
}
function bindRefer(){
  if(!refInfo){ if(!window._refLoading){ window._refLoading=1; api('referInfo',{ref:REF}).then(j=>{ refInfo=j; render(); }); } return; }

  f.onsubmit=async e=>{ e.preventDefault(); const g=id=>document.getElementById(id).value.trim(), b=f.querySelector('button[type=submit]');
    const body={ref:REF,parentName:g('rfp'),friendName:g('rfn'),friendPhone:g('rfph'),friendEmail:g('rfe'),interest:g('rfi'),message:g('rfm')};
    b.disabled=true; b.textContent='Sending…'; const j=await api('refer',body);
    if(j.ok){ refDone=body.friendName; render(); } else { b.disabled=false; b.textContent='Send referral'; document.getElementById('rferr').innerHTML='<div class="err" role="alert">'+esc(j.msg)+'</div>'; } };
}

let trTimer=null;
function wireTeam(){ clearInterval(trTimer); const tr=document.getElementById('trtrack'); if(!tr) return; const cards=[...tr.children]; if(cards.length<2) return;
  let hold=false; const step=()=>cards[1].offsetLeft-cards[0].offsetLeft;
  const idx=()=>Math.round(tr.scrollLeft/step());
  const go=i=>{ const n=cards.length, max=tr.scrollWidth-tr.clientWidth; i=((i%n)+n)%n; tr.scrollTo({left:Math.min(cards[i].offsetLeft-cards[0].offsetLeft,max),behavior:'smooth'}); };
  const atEnd=()=>tr.scrollLeft>=tr.scrollWidth-tr.clientWidth-4;
  const dots=[...document.querySelectorAll('[data-trdot]')];
  const mark=()=>{ let i=atEnd()?cards.length-1:idx(); dots.forEach((d,k)=>{ d.classList.toggle('on',k===i); d.setAttribute('aria-selected',k===i); }); };
  tr.addEventListener('scroll',()=>{ clearTimeout(tr._t); tr._t=setTimeout(mark,80); },{passive:true});
  dots.forEach(d=>d.onclick=()=>go(+d.dataset.trdot));
  document.querySelectorAll('[data-trnav]').forEach(b=>b.onclick=()=>{ const d=+b.dataset.trnav; go(d>0&&atEnd()?0:idx()+d); });
  ['mouseenter','touchstart','focusin'].forEach(e=>tr.parentNode.addEventListener(e,()=>hold=true,{passive:true}));
  ['mouseleave','focusout'].forEach(e=>tr.parentNode.addEventListener(e,()=>hold=false));
  tr.addEventListener('touchend',()=>setTimeout(()=>hold=false,8000),{passive:true});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  trTimer=setInterval(()=>{ if(hold||document.hidden||!document.body.contains(tr)) return; go(atEnd()?0:idx()+1); },6000); }

const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ZONES={IST:'Asia/Kolkata',EST:'America/New_York',CST:'America/Chicago',PST:'America/Los_Angeles',Dubai:'Asia/Dubai'};
const ZNAME={IST:'India (IST)',EST:'US Eastern (EST/EDT)',CST:'US Central (CST/CDT)',PST:'US Pacific (PST/PDT)',Dubai:'Dubai (GST)'};
let VIEWZ=LS.get('sopaan-viewzone')||''; const vz=()=>VIEWZ&&ZONES[VIEWZ]?{timeZone:ZONES[VIEWZ]}:{};
const vzLabel=()=>VIEWZ&&ZONES[VIEWZ]?VIEWZ:'your time';
function zoneSwitch(){ return `<label style="display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--soft)">Show times in <select class="f" data-viewzone style="width:auto;padding:7px 10px;font-size:14px"><option value="">My time</option>${Object.keys(ZONES).map(k=>`<option value="${k}" ${VIEWZ===k?'selected':''}>${ZNAME[k]}</option>`).join('')}</select></label>`; }
function inZone(ms,lab){ return new Date(ms).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',timeZone:ZONES[lab]})+' '+lab; }
function fmtWhen(ms){ const d=new Date(ms); return d.toLocaleDateString(undefined,Object.assign({weekday:'short',day:'numeric',month:'short'},vz()))+' · '+d.toLocaleTimeString(undefined,Object.assign({hour:'numeric',minute:'2-digit'},vz())); }
function fmtTime(ms){ return new Date(ms).toLocaleTimeString(undefined,Object.assign({hour:'numeric',minute:'2-digit'},vz())); }
function rel(ms){ const now=Date.now(), diff=ms-now; if(diff<=0) return 'now'; const sameDay=a=>new Date(a).toDateString(); if(sameDay(ms)===sameDay(now)){ const h=Math.floor(diff/3600000), m=Math.round((diff%3600000)/60000); return h?'in '+h+' h '+m+' min':'in '+m+' min'; }
  const days=Math.round((new Date(new Date(ms).toDateString())-new Date(new Date(now).toDateString()))/86400000); return days===1?'tomorrow':'in '+days+' days'; }
function slotText(s){ const z=' '+(s.tz||''); return s.type==='Once'? 'One class on '+s.date+' at '+s.time+z : 'Every '+s.days.join(', ')+' at '+s.time+z+(s.from?' from '+s.from:'')+(s.until?' until '+s.until:''); }
function gcal(slot,title,details){ if(!slot.nextStart) return ''; const z=ms=>new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+z(slot.nextStart)+'/'+z(slot.nextStart+slot.minutes*60000)+'&details='+encodeURIComponent(details);
  if(slot.type==='Weekly'){ const by=slot.days.map(d=>d.slice(0,2).toUpperCase()).join(','); u+='&recur='+encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY='+by+(slot.until?';UNTIL='+slot.until.replace(/-/g,'')+'T235959Z':'')); }
  return u; }

   <div class="ring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="96" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="14"/><circle id="arc" cx="110" cy="110" r="96" fill="none" stroke="#C79A3E" stroke-width="14" stroke-linecap="round" stroke-dasharray="603.2" stroke-dashoffset="0"/></svg><div class="time"><span id="ct">--:--</span><small id="cs">remaining</small></div></div>

  document.getElementById('cmin').onclick=()=>{ clockMini=!clockMini; drawClock(); };

function notesCard(){ const n=D.notes||[]; if(!n.length) return '';

function doubtsCard(){ const d=D.doubts||[];

function askBox(item,title){ const d=document.createElement('div'); d.className='confirm'; d.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="akt"><h2 id="akt" style="font-size:22px">Ask your teacher</h2><p style="color:var(--soft);margin:6px 0 0">${title?'About: '+esc(title):'Any question about your program'}</p><label class="l" for="akq">Your question</label><textarea class="f" id="akq" rows="4" placeholder="e.g. I don't understand question 4 in practice set 2"></textarea><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" type="button" data-no>Cancel</button><button class="btn" type="button" data-yes>Send</button></div></div>`;
  document.body.appendChild(d); d.querySelector('#akq').focus(); d.querySelector('[data-no]').onclick=()=>d.remove();
  d.querySelector('[data-yes]').onclick=async()=>{ const q=d.querySelector('#akq').value.trim(); if(q.length<3){ toast('Type your question.'); return; } const j=await api('askDoubt',{item:item||'',question:q}); d.remove(); toast(j.ok?'Sent to your teacher.':j.msg); if(j.ok) refresh(); }; }
function timetableCard(){
  const nx=D.next||[], sl=D.slots||[], s=D.student; if(!nx.length&&!sl.length) return '';

   <div style="flex:2 1 320px"><span style="font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--goldtx);font-weight:700">Your weekly timetable</span>
   ${sl.length?`<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">${sl.map(x=>{ const g=gcal(x,'Sopaan class · '+s.progName,'With '+(s.teacherName||'your teacher')+(s.meet?'\nClass link: '+s.meet:'')); return `<div class="row" style="justify-content:space-between;gap:8px"><span style="font-size:14.5px">${esc(slotText(x))}</span>${g?`<a class="btn ghost sm" href="${esc(g)}" target="_blank" rel="noopener">Add to Google Calendar</a>`:''}</div>`; }).join('')}</div>`:''}</div></div>
  ${(()=>{ const W=weekCal(nx,o=>{ const st=calState(o); return `<div class="calc ${st.past?'past':''}"><span class="calt">${esc(fmtTime(o.start))}${calTz(o)?` <span class="calz">· ${esc(inZone(o.start,o.tz))} class time</span>`:''}</span><b>${esc(s.progName||'Class')}${s.teacherName?' — with '+esc(s.teacherName):''}</b><span class="cald">${o.minutes} min${o.note?' · '+esc(o.note):''}${st.soon?' · starting soon: use Join class above':''}</span></div>`; });

/* Links between sheet files (chapter page → topic, ⬇ Easier / ⬆ Harder) open the matching Hub sheet instead of a broken page. */
const LINKJS='<script>(function(){document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href")||"";if(/^(https?:|mailto:|tel:|#|javascript:)/i.test(h))return;var m=h.match(/([\\w.-]+)\\.html(?:[?#].*)?$/i);if(!m)return;e.preventDefault();e.stopPropagation();parent.postMessage({sopaanGo:m[1]},"*");},true);})();<\/script>';
function lockFor(){ const u=(D&&(D.student||D.me))||null; return u?{login:String(u.id||'student'),name:String(u.name||u.id||'Student')}:{login:'VISITOR',name:'Visitor'}; }
/* Sheets made for the older lock pages wait for window.__SOPAAN_LOCK__; the Hub already knows who is signed in, so it supplies it. */
function lockable(h){ if(h.indexOf('__SOPAAN_LOCK__')<0) return h; const L=lockFor(), js='<script>window.__SOPAAN_LOCK__='+JSON.stringify({login:L.login,name:L.name,token:'',api:'about:blank',home:''}).replace(/</g,'\\u003c')+';<\/script>';
  return /<head(\s[^>]*)?>/i.test(h)?h.replace(/<head(\s[^>]*)?>/i,m=>m+js):js+h; }
/* Sheets with their own on-device sign-in (name, roll no., PIN): the Hub already knows the student, so it signs them in there. */
function signable(h){ if(h.indexOf('sopaan-students-v1')<0) return h; const L=lockFor(); if(!L||!L.login) return h; const name=String(L.name||L.login).replace(/\s+/g,' ').trim(), roll=String(L.login);
  const js='<script>(function(){ var name='+JSON.stringify(name).replace(/</g,'\\u003c')+', roll='+JSON.stringify(roll)+', pin="2468", key=name.toLowerCase()+"#"+roll.toLowerCase();'+
   ' function hA(p,s){ var h=2166136261, t=s+"|"+p; for(var i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h.toString(36); }'+
   ' function hB(id,p){ var t="sopaan|"+id+"|"+p, h=5381; for(var i=0;i<t.length;i++){ h=((h<<5)+h+t.charCodeAt(i))>>>0; } return h.toString(36); }'+
   ' try{ var a=JSON.parse(localStorage.getItem("sopaan-students-v1")||"null")||{}; a.students=a.students||{}; var o=a.students[key]||{name:name,roll:roll,created:Date.now()}; o.pin=hA(pin,key); a.students[key]=o;'+
   ' var b=a[key]&&typeof a[key]==="object"?a[key]:{name:name,roll:roll,last:Date.now()}; b.pin=hB(key,pin); a[key]=b; localStorage.setItem("sopaan-students-v1",JSON.stringify(a)); }catch(e){}'+
   ' function fill(f,v){ var e=document.getElementById(f); if(!e) return false; e.value=v; return true; }'+
   ' var n=0; function go(){ n++; try{'+
   '  if(document.getElementById("lgPin")&&fill("lgName",name)&&fill("lgRoll",roll)&&fill("lgPin",pin)){ var f=document.getElementById("loginForm"); if(f){ if(f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event("submit",{cancelable:true})); return; } }'+
   '  if(document.getElementById("inPin")&&fill("inName",name)&&fill("inRoll",roll)&&fill("inPin",pin)){ var btn=document.querySelector("[data-act=signin]"); if(btn){ btn.click(); return; } }'+
   ' }catch(e){} if(n<30) setTimeout(go,200); }'+
   ' if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",function(){ setTimeout(go,50); }); else setTimeout(go,50); })();<\/script>';
  return /<\/body>/i.test(h)?h.replace(/<\/body>(?![\s\S]*<\/body>)/i,js+'</body>'):h+js; }
function linkable(h){ h=signable(lockable(String(h||''))); return /<\/body>/i.test(h)?h.replace(/<\/body>(?![\s\S]*<\/body>)/i,LINKJS+'</body>'):h+LINKJS; }
function fileItem(f){ const ch=String(f).match(/^(n11|n12|igh|igo|ibox|ibcam)-([a-z]?\d+)-(\d+[a-z]?)-/i); if(ch) return ('CH'+ch[1]+'-'+ch[2]+'-'+ch[3]).toUpperCase(); const h=String(f).match(/^hcv-(\d+)-(\d+)-/i); if(h) return 'PHYCOP-'+String(+h[1]).padStart(2,'0')+'-'+h[2]; if(/^hcv-demo/i.test(f)) return 'PHYCOP-DEMO'; const m=String(f).match(/uscc-g(\d)-ch(\d+)(?:-lo(\d+))?/i); if(m) return 'USCC'+m[1]+'-CH'+String(+m[2]).padStart(2,'0')+(m[3]?'-LO'+m[3]:''); return String(f).toUpperCase(); }
window.addEventListener('message',e=>{ const fr=document.getElementById('sframe'); if(!fr||e.source!==fr.contentWindow||!e.data||!e.data.sopaanGo) return;
  const id=fileItem(e.data.sopaanGo);
  if(/^index$/i.test(e.data.sopaanGo)){ toast('To open another sheet, use Save and close, then pick it from your list.'); return; }
  if(role!=='student'||!D||!D.items){ toast('That link opens another sheet. Open it from the program list.'); return; }
  const it=D.items.find(i=>i.id===id);
  if(!it){ toast('That sheet is not in your programs yet. Ask your teacher if you need it.'); return; }
  if(it.status==='finished'){ toast('You have already attempted "'+it.title+'".'); return; }
  const d=document.createElement('div'); d.className='confirm'; d.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2 style="font-size:22px">Open "${esc(it.title)}"?</h2><p style="color:var(--soft);margin:8px 0 0">This sheet closes; your work in it is saved on this device.</p><div class="row" style="justify-content:flex-end;margin-top:16px;gap:8px"><button class="btn ghost" data-no type="button">Stay here</button><button class="btn" data-yes type="button">Open</button></div></div>`;
  document.body.appendChild(d); d.querySelector('[data-no]').onclick=()=>d.remove(); d.querySelector('[data-yes]').onclick=()=>{ d.remove(); openSheet(id); }; d.querySelector('[data-yes]').focus(); });
async function openSheet(id,hw){
  document.getElementById('modal').innerHTML=`<div class="sheetwrap">${loading()}</div>`;
  const j=await api('open',hw?{item:id,hw}:{item:id});
  if(!j.ok){ document.getElementById('modal').innerHTML=''; toast(j.msg); refresh(); return; }
  document.getElementById('modal').innerHTML=`<div class="sheetwrap" role="dialog" aria-label="${esc(j.item.title)}"><div class="sheetbar"><b>${esc(j.item.title)}</b>${(j.item.parts||[]).length?`<span style="font-size:13.5px;color:#CFD7EA">${esc(j.item.parts.map(p=>p.name).join(' · '))}</span>`:''}<span style="flex:1"></span><button class="btn ghost sm" id="sask" type="button">I'm stuck</button><button class="btn ghost sm" id="sclose" type="button">Save and close</button><button class="btn gold sm" id="sfin" type="button">I'm finished</button></div><iframe id="sframe" title="${esc(j.item.title)}"></iframe></div>`;
  document.getElementById('sframe').srcdoc=linkable(j.html);
  document.getElementById('sask').onclick=()=>askBox(id,j.item.title);
  document.getElementById('sclose').onclick=()=>{ document.getElementById('modal').innerHTML=''; refresh(); };
  document.getElementById('sfin').onclick=()=>confirmBox('Finish this sheet?',(j.item.parts||[]).length?'After you finish, these parts are locked for you. Only your teacher can open them again.':'After you finish, this sheet is locked for you. Only your teacher can open it again.','Yes, I\'m finished',async()=>{ const f=await api('finish',hw?{item:id,hw}:{item:id}); document.getElementById('modal').innerHTML=''; toast(f.ok?'Well done! This sheet is now finished.':f.msg); refresh(); });
}
function confirmBox(title,text,ok,fn){ const d=document.createElement('div'); d.className='confirm'; d.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="cft"><h2 id="cft" style="font-size:22px">${esc(title)}</h2><p style="color:var(--soft);line-height:1.5">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" type="button" data-no>Cancel</button><button class="btn" type="button" data-yes>${esc(ok)}</button></div></div>`; document.body.appendChild(d); d.querySelector('[data-no]').onclick=()=>d.remove(); d.querySelector('[data-yes]').onclick=()=>{ d.remove(); fn(); }; }

function progOptions(cur){ return GROUPS.map(g=>{ const ps=(D.programs||[]).filter(p=>p.group===g); return ps.length?`<optgroup label="${g}">${ps.map(p=>`<option value="${esc(p.id)}" ${p.id===cur?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup>`:''; }).join('')+(cur&&!P(cur)?`<option value="${esc(cur)}" selected>${esc(cur)} (not in your programs)</option>`:''); }

const IDX={};
async function loadIdx(progs){ const need=progs.filter(p=>!IDX[p]); if(!need.length) return true; const j=await api('partsIndex',{progs:need}); if(!j.ok){ toast(j.msg); return false; }
  need.forEach(p=>IDX[p]=[]); j.items.forEach(it=>{ (IDX[it.prog]=IDX[it.prog]||[]).push(it); }); return true; }
function assignBox(s,opt){
  const A={kind:opt.kind||'Homework',prog:(s.progs||[])[0]||((D.programs||[])[0]||{}).id||'',q:'',sel:new Map()};

  d.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="pkt" style="max-width:820px;width:100%;display:flex;flex-direction:column;gap:8px">
   <div class="row" style="justify-content:space-between"><h2 id="pkt" style="font-size:22px">${opt.collect?'Choose homework':'Homework and assigned sheets'} · ${esc(s.name||s.id)}</h2><button class="btn ghost sm" type="button" data-x aria-label="Close">Close</button></div>
   ${opt.collect?'':`<div class="row" style="gap:14px"><label style="display:flex;gap:6px;align-items:center;font-size:14.5px"><input type="radio" name="pkind" value="Homework" ${A.kind==='Homework'?'checked':''} style="accent-color:var(--navy2)">Homework (with a due date)</label><label style="display:flex;gap:6px;align-items:center;font-size:14.5px"><input type="radio" name="pkind" value="Extra" ${A.kind==='Extra'?'checked':''} style="accent-color:var(--navy2)">Assigned sheets (no due date)</label></div>`}

    <input class="f" id="pkq" placeholder="Search a topic or learning objective, e.g. chain rule" style="flex:2 1 260px" aria-label="Search"></div>
   <div id="pklist" style="border:1px solid #EFE8D6;border-radius:12px;max-height:52vh;overflow:auto;padding:4px 10px">${loading()}</div>
   <div class="row" style="justify-content:space-between;gap:8px"><span id="pksum" style="font-size:14px;color:var(--soft)">Nothing chosen yet</span><span class="row" style="gap:8px">${opt.collect?'':`<input class="f" id="pkdue" type="date" style="width:auto" aria-label="Due date">`}<button class="btn" type="button" data-go>${opt.collect?'Use these':'Set homework'}</button></span></div></div>`;
  document.body.appendChild(d);
  const $d=q=>d.querySelector(q), list=$d('#pklist');
  if(A.prog) $d('#pkprog').value=A.prog;
  const progsNow=()=>A.prog==='__all'?(D.programs||[]).map(p=>p.id).concat([...own]).filter((v,i,a)=>a.indexOf(v)===i):[A.prog];
  const label=it=>{ const v=A.sel.get(it.id); if(!v) return ''; if(v==='whole') return it.title; const names=(it.parts||[]).filter(p=>v.has(p.id)).map(p=>p.name); return it.title+': '+names.join(', '); };
  const allItems=()=>progsNow().flatMap(p=>IDX[p]||[]);
  function summary(){ const n=A.sel.size; $d('#pksum').textContent=n?n+' sheet'+(n===1?'':'s')+' chosen: '+allItems().filter(it=>A.sel.has(it.id)).map(label).join('; ').slice(0,220):'Nothing chosen yet';
    const go=$d('[data-go]'); if(!opt.collect) go.textContent=A.kind==='Extra'?'Assign sheets':'Set homework'; const due=$d('#pkdue'); if(due) due.style.display=A.kind==='Extra'?'none':''; }
  function draw(){
    const q=A.q.trim().toLowerCase(), items=allItems(); let html='', shown=0, sec='';

      const parts=(it.parts||[]).filter(p=>!q||titleHit||hit(p.name)||hit(p.obj)); if(q&&!titleHit&&!parts.length) continue;
      if(++shown>80) break;
      const v=A.sel.get(it.id), whole=v==='whole', head=(A.prog==='__all'?pname(it.prog)+' · ':'')+(it.section||'');
      if(head!==sec){ sec=head; html+=`<div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--goldtx);font-weight:700;margin:12px 0 4px">${esc(head)}</div>`; }
      html+=`<div style="border-bottom:1px solid #EFE8D6;padding:8px 0"><label style="display:flex;gap:8px;align-items:flex-start;font-size:15px"><input type="checkbox" data-whole="${esc(it.id)}" ${whole?'checked':''} style="width:17px;height:17px;margin-top:2px;accent-color:var(--navy2)"><span><b>${esc(it.title)}</b> <span style="font-size:12.5px;color:var(--soft)">${esc(it.type)}${(it.parts||[]).length?' · whole sheet':''}</span></span></label>
        ${parts.length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 25px">${parts.map(p=>`<label style="display:inline-flex;gap:5px;align-items:center;font-size:13.5px;border:1px solid ${v&&v!=='whole'&&v.has(p.id)?'var(--navy2)':'#E4DCC8'};background:${v&&v!=='whole'&&v.has(p.id)?'#EEF2FA':'#fff'};border-radius:8px;padding:4px 8px;${whole?'opacity:.45':''}"><input type="checkbox" data-part="${esc(it.id)}|${esc(p.id)}" ${v&&v!=='whole'&&v.has(p.id)?'checked':''} ${whole?'disabled':''} style="accent-color:var(--navy2)">${esc(p.name)}${p.kind==='Test'?' <span class="pill p-gold" style="padding:1px 6px;font-size:11px">Test</span>':''}${p.q?` <span style="color:var(--soft)">${p.q}q</span>`:''}</label>`).join('')}</div>`:''}</div>`;
    }

  reload();
}

function weekCal(list,card){
  const dkey=ms=>new Date(ms).toLocaleDateString('en-CA',vz()), groups={}; list.forEach(o=>{ const k=dkey(o.start); (groups[k]=groups[k]||[]).push(o); });
  const today=dkey(Date.now()), t0=new Date(today+'T12:00:00Z').getTime();
  const days=[...Array(7)].map((_,i)=>new Date(t0+(calWeek*7+i)*86400000).toISOString().slice(0,10));
  const lab=(k,o)=>new Date(k+'T12:00:00Z').toLocaleDateString(undefined,Object.assign({timeZone:'UTC'},o));
  const n=days.reduce((t,k)=>t+(groups[k]||[]).length,0);

  return {title:calWeek===0?'Next 7 days':calWeek===1?'The 7 days after':'In '+calWeek+' weeks', range:`${lab(days[0],{weekday:'short',day:'numeric',month:'short'})} to ${lab(days[6],{weekday:'short',day:'numeric',month:'short'})} · ${n} class${n===1?'':'es'}`,

    html:`<div class="cal">${html}</div>`}; }

const UP={list:[],busy:false,stop:false};
const upIcon=s=>s==='replaced'?'<span class="pill p-ok">Replaced</span>':s==='added'?'<span class="pill p-ok">Added</span>':s==='uploading'?'<span class="pill p-info">Uploading…</span>':s==='waiting'?'<span class="pill p-mute">Waiting</span>':`<span class="pill p-bad">Not uploaded</span>`;
function upCounts(){ const c={done:0,bad:0,wait:0}; UP.list.forEach(x=>{ if(x.st==='replaced'||x.st==='added') c.done++; else if(x.st==='waiting'||x.st==='uploading') c.wait++; else c.bad++; }); return c; }

  return `<h1 style="font-size:32px">Upload sheets</h1><p style="color:var(--soft);margin:4px 0 18px;max-width:780px">Put new or updated sheets straight into your private Drive folder — no GitHub needed. Name each file with its <b>Item ID</b> (for example <span class="mono">CHIBCAM-22-2.html</span>), or choose a <b>.zip</b> of a whole program. Sample-paper PDFs (<span class="mono">SP-L1-01_Paper.pdf</span>, <span class="mono">SP-L1-01_MarkingScheme.pdf</span>) and answer keys (<span class="mono">SP-L1-01_answers.json</span>) go here too. A file that is already in Drive is <b>replaced</b>, so links and students' progress stay. A new file is added only if its row is in the Content Map.</p>

function loadZipLib(){ return window.JSZip?Promise.resolve():new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload=ok; s.onerror=()=>no(new Error('Could not load the zip reader. Check your internet.')); document.head.appendChild(s); }); }
async function upAdd(files){ const seen=new Set(UP.list.map(x=>x.name.toLowerCase()));
  const add=(name,get,bin)=>{ name=name.replace(/^.*[\\/]/,''); if(!/\.(html?|pdf|json)$/i.test(name)||/^(index|\._)/i.test(name)||seen.has(name.toLowerCase())) return; if(/\.(pdf|json)$/i.test(name)&&!/_(Paper|MarkingScheme)\.pdf$|_answers\.json$/i.test(name)) return; seen.add(name.toLowerCase()); UP.list.push({name,get,bin,st:'waiting',msg:''}); };
  for(const f of files){ if(/\.zip$/i.test(f.name)){ try{ await loadZipLib(); const z=await JSZip.loadAsync(f); z.forEach((path,e)=>{ if(!e.dir){ const bin=/\.(pdf|json)$/i.test(path); add(path,()=>e.async(bin?'base64':'string'),bin); } }); }catch(e){ toast(e.message||'Could not open '+f.name); } } else { const bin=/\.(pdf|json)$/i.test(f.name); add(f.name,()=>bin?fileB64(f):f.text(),bin); } }
  render(); }
function upPaint(i){ const r=document.getElementById('upr'+i); if(r){ const x=UP.list[i]; r.outerHTML=`<div class="att" id="upr${i}"><span class="mono" style="flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis">${esc(x.name)}</span>${x.msg?`<span style="font-size:13px;color:var(--soft);flex:2;min-width:0">${esc(x.msg)}</span>`:''}${upIcon(x.st)}</div>`; } const s=document.getElementById('upsum'); if(s) s.innerHTML=upSum(); }
async function upRun(){ if(UP.busy) return; UP.busy=true; UP.stop=false; render();
  for(let i=0;i<UP.list.length;i++){ const x=UP.list[i]; if(UP.stop) break; if(x.st!=='waiting') continue;
    x.st='uploading'; upPaint(i); let j;
    try{ const data=await x.get(); j=await api('uploadSheet',x.bin?{name:x.name,b64:data}:{name:x.name,html:data}); }catch(e){ j={ok:false,msg:e.message}; }
    if(j.ok){ x.st=j.mode; x.msg=''; } else if(/reach the server/.test(j.msg||'')){ x.st='waiting'; x.msg='Connection lost — try again.'; upPaint(i); UP.stop=true; break; } else { x.st='bad'; x.msg=j.msg||'Failed'; }
    upPaint(i); }
  UP.busy=false; render(); const c=upCounts(); toast(c.wait?'Stopped. Press Upload to continue.':`Upload finished: ${c.done} done${c.bad?', '+c.bad+' not uploaded':''}.`); }
function wireUpload(){ const f=document.getElementById('upf'); if(f) f.onchange=()=>{ upAdd([...f.files]); f.value=''; };

  if(view.tab==='upload') wireUpload();
  if(view.tab==='payments') wirePayments();
  app.querySelectorAll('[data-start]').forEach(a=>a.addEventListener('click',()=>startClass(a.dataset.start)));
  const s=sel&&D&&(D.students||[]).find(x=>x.id===sel);
  const done=async(j,ok)=>{ if(j.ok){ if(ok) toast(ok); await refresh(); } else toast(j.msg); };
  if(s){
    on('[data-act=wareport]',async()=>{ const w=window.open('','_blank'); const r=await api('waReport',{sid:s.id}); if(!r.ok){ if(w) w.close(); return toast(r.msg||'Could not make the report.'); } const u='https://wa.me/'+(r.phone||'')+'?text='+encodeURIComponent(r.text); if(w) w.location=u; else location.href=u; });
    on('[data-act=save]',async()=>{ const b={sid:s.id,name:$('#ename').value,progs:[...app.querySelectorAll('[data-eprog]')].filter(c=>c.checked).map(c=>c.dataset.eprog),tz:$('#etz').value,meet:$('#emeet').value.trim(),wb:$('#ewb').value.trim(),email:$('#cemail').value.trim(),parentName:$('#cpname').value.trim(),parentEmail:$('#cpemail').value.trim(),parentPhone:$('#cpphone').value.trim(),freq:($('#cfreq')||{}).value}; const et=$('#etch'); if(et) b.teacher=et.value; done(await api('saveStudent',b),'Saved.'); });
    on('[data-act=pin]',async()=>{ const j=await api('resetPin',{sid:s.id}); done(j,j.ok?'New PIN for '+s.id+': '+j.pin:''); });
    on('[data-act=pause]',async()=>done(await api('saveStudent',{sid:s.id,status:s.status==='Active'?'Paused':'Active'})));
    on('[data-act=del]',()=>confirmBox('Delete '+s.id+'?','This removes the student\'s login. Their past attempts stay in the sheet.','Delete',async()=>{ sel=null; done(await api('deleteStudent',{sid:s.id}),'Deleted.'); }));
    app.querySelectorAll('[data-rmdev]').forEach(b=>b.onclick=async()=>done(await api('removeDevice',{sid:s.id,device:b.dataset.rmdev}),'Device removed.'));
    app.querySelectorAll('input[name=stype]').forEach(r=>r.onchange=()=>{ const once=$('input[name=stype]:checked').value==='Once'; $('#sdays').style.display=once?'none':''; $('#srange').style.display=once?'none':''; $('#sdatebox').style.display=once?'':'none'; });
    on('[data-act=addslot]',async()=>{ const type=$('input[name=stype]:checked').value; const days=[...app.querySelectorAll('#sdays input:checked')].map(c=>c.value);
      done(await api('addSlot',{sid:s.id,type,days,date:$('#sdate').value,time:$('#stime').value,tz:'IST',minutes:$('#smin').value,from:$('#sfrom').value,until:$('#suntil').value,note:$('#snote').value}),'Added to the timetable.'); });
    app.querySelectorAll('[data-rmslot]').forEach(b=>b.onclick=async()=>done(await api('removeSlot',{sid:s.id,slot:b.dataset.rmslot}),'Removed.'));
    on('[data-act=pickhw]',()=>assignBox(s,{kind:'Homework'}));
    on('[data-act=pickextra]',()=>assignBox(s,{kind:'Extra'}));
    app.querySelectorAll('[data-resethw]').forEach(b=>b.onclick=async()=>done(await api('resetHomework',{sid:s.id,hw:b.dataset.resethw}),'The student can do it again.'));
    const stl=$('#stime'), stlo=$('#stimeloc'); if(stl&&stlo&&s.tz&&s.tz!=='IST'){ const upd=()=>{ const v=stl.value; if(!/^\d\d:\d\d$/.test(v)){ stlo.textContent=''; return; } const now=new Date(), ymd=now.toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}); const ms=Date.parse(ymd+'T'+v+':00+05:30'); const ld=new Date(ms).toLocaleDateString('en-CA',{timeZone:ZONES[s.tz]}); stlo.textContent='= '+new Date(ms).toLocaleTimeString(undefined,{timeZone:ZONES[s.tz],hour:'numeric',minute:'2-digit'})+' '+s.tz+' for the student'+(ld<ymd?' (the day before)':ld>ymd?' (the next day)':''); }; stl.oninput=upd; upd(); }
    app.querySelectorAll('[data-rmhw]').forEach(b=>b.onclick=async()=>done(await api('removeHomework',{sid:s.id,hw:b.dataset.rmhw}),'Removed.'));
    app.querySelectorAll('[data-reatt]').forEach(b=>b.onclick=async()=>done(await api('resetAttempt',{sid:s.id,item:b.dataset.reatt}),'Re-attempt allowed.'));
  }
  app.querySelectorAll('[data-pick]').forEach(c=>c.onchange=()=>{ c.checked?enrol.ids.add(c.dataset.pick):enrol.ids.delete(c.dataset.pick); render(); });
  app.querySelectorAll('input[name=eprog]').forEach(r=>r.onchange=()=>{ enrol.prog=r.value; render(); });
  app.querySelectorAll('input[name=emode]').forEach(r=>r.onchange=()=>{ enrol.mode=r.value; });
  const pq=$('#pq'); if(pq) pq.oninput=()=>{ enrol.q=pq.value; const p=pq.selectionStart; render(); const n=document.getElementById('pq'); n.focus(); n.setSelectionRange(p,p); };
  on('[data-act=newstu]',async()=>{ const nm=$('#nname').value.trim(); if(!nm){ toast('Type a name first.'); return; } const nt=$('#ntch'); const j=await api('createStudent',{name:nm,teacher:nt?nt.value:''}); if(j.ok){ enrol.ids.add(j.student.id); } done(j,j.ok?'Created '+j.student.id+' (PIN '+j.student.pin+').':''); });
  on('[data-act=doenrol]',async()=>{ const j=await api('enrol',{sids:[...enrol.ids],prog:enrol.prog,mode:enrol.mode==='replace'?'replace':'add'}); if(j.ok){ slips=j.enrolled; enrol.ids=new Set(); } done(j,j.ok?'Enrolled '+j.enrolled.length+'.':''); });
  on('[data-act=copyslips]',()=>{ const t=slips.map(x=>`${x.name}\nLogin ID: ${x.id}   PIN: ${x.pin}\nPrograms: ${(x.progs||[x.prog]).map(pname).join(', ')}\n`).join('\n'); try{ navigator.clipboard.writeText(t).then(()=>toast('Slips copied.'),()=>toast('Copy was blocked.')); }catch(e){ toast('Copy was blocked.'); } });
  app.querySelectorAll('[data-tsel]').forEach(b=>b.onclick=()=>{ selT=b.dataset.tsel||null; render(); });
  app.querySelectorAll('[data-tgall]').forEach(b=>b.onclick=()=>{ app.querySelectorAll(`[data-tprog][data-g="${b.dataset.tgall}"]`).forEach(c=>c.checked=true); });
  on('[data-act=savetp]',async()=>{ const progs=[...app.querySelectorAll('[data-tprog]')].filter(c=>c.checked).map(c=>c.dataset.tprog); done(await api('setTeacherPrograms',{tid:selT,progs}),'Programs saved.'); });
  on('[data-act=tpause]',async()=>{ const T=D.teachers.find(t=>t.id===selT); done(await api('saveTeacher',{tid:selT,status:T.status==='Active'?'Paused':'Active'})); });
  on('[data-act=tpw]',async()=>{ const pw='sop-'+Math.random().toString(36).slice(2,8); const j=await api('saveTeacher',{tid:selT,password:pw}); done(j,j.ok?'New password for '+selT+': '+pw:''); });
  const ta=$('#tadd'); if(ta) ta.onsubmit=async e=>{ e.preventDefault(); const j=await api('saveTeacher',{name:$('#tn').value,email:$('#te').value,password:$('#tp').value}); if(j.ok) selT=j.teacher.id; done(j,j.ok?'Teacher added. Now give them programs.':''); };
  const pa=$('#padd'); if(pa) pa.onsubmit=async e=>{ e.preventDefault(); const items=$('#prows').value.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const [title,link,type,section]=l.split('|').map(x=>(x||'').trim()); return {title,link,type,section}; });
    const j=await api('addProgram',{id:$('#pid').value,name:$('#pname').value,group:$('#pgrp').value,board:$('#pboard').value,notes:$('#pnote').value,items});
    if(j.ok){ toast('Program added with '+j.added+' items. Import its files from the Google Sheet menu.'); view.tab='teachers'; refresh(); } else $('#perr').innerHTML='<div class="err">'+esc(j.msg)+'</div>'; };
}

/* ================= START ================= */
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
render();
if(!REF) (async()=>{ const j=await api('catalog'); if(j.ok){ catalog=j.programs; SITE=j.site||SITE; PAY=j.pay||PAY; if(view.page==='home'||view.page==='login') render(); if(view.page==='home') hit('home');
  const rn=location.search.match(/[?&]renew=([\w-]+)/); if(rn){ const sid=(location.search.match(/[?&]sid=([\w-]+)/)||[])[1]||'', n=decodeURIComponent((location.search.match(/[?&]n=([^&]*)/)||[])[1]||''); history.replaceState(null,'',location.pathname+location.hash);
    const p=catalog.find(x=>x.id===decodeURIComponent(rn[1])); if(p&&priceOf(p)) openBuy(p,{sid,n}); else toast('Please contact us to renew this program.'); } } })();
if(token&&!REF){ refresh().then(startPolling); }
</script>
</body>
</html>
