<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sopaan · Brain &amp; Mind Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--navy:#16264A;--navy2:#1F3B6B;--gold:#C79A3E;--goldtx:#8A661F;--goldlt:#E0C27F;--paper:#FBF9F4;--paper2:#F1EAD8;--ink:#211E1A;--soft:#655D4C;--rule:#E4DCC8;--ok:#2E6B47;--okbg:#E1F2E7;--bad:#8A3B1F;--badbg:#F9ECE7;--info:#1F3B6B;--infobg:#E7F1FB;--plum:#4B3A7A;--plumbg:#EFEDFF}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;color:var(--navy)}
.mono{font-family:'IBM Plex Mono',monospace}a{color:var(--navy2)}button{font-family:inherit;cursor:pointer}
.demo{background:#2B2417;color:#F4EFDF;font-size:13.5px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.demo b{color:var(--goldlt)}.demo button{background:transparent;color:#F4EFDF;border:1px solid rgba(244,239,223,.35);border-radius:7px;padding:5px 10px;font-size:13px}.demo .sp{flex:1}
header.top{background:var(--navy);color:#F4EFDF}
.bar{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px;color:#F4EFDF;background:none;border:none;padding:0}
.crest{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:700;font-size:20px}
.bt1{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--goldlt);font-weight:700;display:block;text-align:left}
.bt2{font-family:Fraunces,serif;font-size:20px;font-weight:600;display:block;text-align:left}
.role{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:rgba(224,194,127,.18);color:var(--goldlt)}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 90px}
.card{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:22px}
.btn{border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--navy2);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #D9D0BA}.btn.green{background:#2E6B47;color:#fff}.btn.sm{padding:8px 12px;font-size:13.5px}.btn:disabled{opacity:.45;cursor:not-allowed}
label.l{display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin:12px 0 6px}
input.f,select.f,textarea.f{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #D9D0BA;border-radius:10px;background:var(--paper);color:var(--ink)}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px var(--paper2)}
.note{display:flex;gap:10px;background:var(--paper2);border-radius:10px;padding:11px 12px;font-size:14px;color:#5A4A24;line-height:1.45}
.err{background:var(--badbg);color:var(--bad);border-radius:10px;padding:11px 12px;font-size:14.5px;margin-top:12px}
.okm{background:var(--okbg);color:var(--ok);border-radius:10px;padding:11px 12px;font-size:14.5px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-bad{background:var(--badbg);color:var(--bad)}.p-info{background:var(--infobg);color:var(--info)}.p-mute{background:#F0EFEC;color:#4A463E}.p-gold{background:var(--paper2);color:#5A4A24}.p-live{background:#E1F2E7;color:#1F5A37}
.hero{background:var(--navy);color:#F4EFDF}
.heroin{max-width:1240px;margin:0 auto;padding:44px 20px 60px;display:flex;flex-wrap:wrap;gap:36px;align-items:center}
.heroin h1{color:#F4EFDF;font-size:50px;line-height:1.04}.heroin p{color:#CFD7EA;font-size:18px;line-height:1.6;max-width:520px}
.signin{flex:1 1 360px;max-width:440px;background:#fff;color:var(--ink);border-radius:18px;padding:24px;box-shadow:0 24px 60px rgba(8,14,32,.35)}
.rtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--paper2);padding:5px;border-radius:12px;margin-bottom:6px}
.rtab{border:none;background:none;border-radius:9px;padding:10px 6px;font-weight:700;font-size:14.5px;color:var(--soft)}.rtab.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);padding:12px 14px;border-bottom:1px solid var(--rule)}
td{padding:12px 14px;border-bottom:1px solid #EFE8D6;vertical-align:middle}
.tbox{background:#fff;border:1px solid var(--rule);border-radius:14px;overflow-x:auto}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.list .it{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:14px 18px;border-bottom:1px solid #EFE8D6}.list .it:last-child{border-bottom:none}
.it .n{width:38px;color:var(--soft);font-size:13px}.it .t{flex:1 1 260px;min-width:0}.it .t b{display:block;font-size:16px}.it .t span{font-size:13.5px;color:var(--soft)}
.phase{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--goldtx);padding:16px 18px 6px;background:#FCFAF4;border-bottom:1px solid #EFE8D6}
.overlay{position:fixed;inset:0;background:rgba(20,18,14,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:18px;max-width:680px;width:100%;max-height:90vh;overflow:auto;position:relative}
.wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.09;display:flex;flex-wrap:wrap;align-content:flex-start;gap:40px 60px;padding:20px;transform:rotate(-18deg) scale(1.3)}.wm span{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--navy);white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14.5px;color:var(--soft)}.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.radio{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;font-size:15px;cursor:pointer;background:#fff}.radio.on{border:2px solid var(--navy2);background:#EEF2F8}.radio input{width:18px;height:18px;accent-color:var(--navy2)}
.prog-h{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--goldtx);margin:14px 0 8px}
.slip{border:1.5px dashed #C9BE9F;border-radius:12px;padding:14px 16px;background:#fff;flex:0 1 300px}
.sr{position:absolute;left:-9999px}
/* class clock */
#clock{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);background:var(--navy);color:#F4EFDF;border-radius:24px;padding:26px 26px 22px;box-shadow:0 30px 80px rgba(8,14,32,.5);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
#clock.mini{top:12px;transform:translateX(-50%);width:auto;flex-direction:row;padding:8px 10px 8px 16px;border-radius:99px;gap:12px}
#clock .lbl{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--goldlt);font-weight:700}
#clock .who{font-family:Fraunces,serif;font-size:20px}
#clock .ring{position:relative;width:220px;height:220px}
#clock .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
#clock .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:600}
#clock .time small{font-family:'Source Sans 3',sans-serif;font-size:13px;color:#CFD7EA;font-weight:600;letter-spacing:.04em}
#clock.mini .ring,#clock.mini .who,#clock.mini .lbl,#clock.mini .full{display:none}
#clock .minitime{display:none;font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600}
#clock.mini .minitime{display:block}
#clock .cbtn{background:rgba(255,255,255,.1);color:#F4EFDF;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
#clock .cbtn.go{background:var(--gold);color:var(--navy);border-color:var(--gold)}
#clock.mini .cbtn{padding:6px 10px;font-size:13px}
@media (max-width:640px){.heroin h1{font-size:36px}}

.lhero{background:radial-gradient(1200px 500px at 80% -10%,#24407A 0%,transparent 60%),var(--navy);color:#F4EFDF;position:relative;overflow:hidden}
.sci{position:absolute;inset:0;pointer-events:none}
.sci .fx{position:absolute;font-family:'IBM Plex Mono',monospace;color:#E0C27F;opacity:.16;white-space:nowrap;animation:drift 14s ease-in-out infinite alternate}
.sci .deco{position:absolute;fill:none;stroke:#9FB4DC;stroke-width:2;opacity:.18}
@keyframes drift{from{translate:0 0}to{translate:0 -14px}}
@media (prefers-reduced-motion:reduce){.sci .fx{animation:none}}
.lhero .heroin{padding:48px 20px 64px}
.heroin h1.bma,.bma{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:76px;line-height:.98;letter-spacing:-.015em;color:#F4EFDF;margin:0}
.sop{display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--gold);padding-left:14px}
.sopn{font-family:Fraunces,serif;font-size:40px;font-weight:600;color:var(--gold);line-height:1.1}
.sopt{font-size:15px;letter-spacing:.06em;color:#CFD7EA}
.subj{display:flex;flex-wrap:wrap;gap:10px}
.subj span{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:8px 14px;font-weight:700;font-size:15px}
.subj svg{width:20px;height:20px;fill:none;stroke:#E0C27F;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lhero p{color:#CFD7EA;font-size:17px;line-height:1.6;max-width:520px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pgrp{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:20px}
.pgrp h3{font-size:20px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:12px}
.pgrp h3 .mono{font-size:13px;color:var(--goldtx);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;padding:6px 11px;border-radius:8px;background:var(--paper2);color:#3A342A}
@media (max-width:640px){.heroin h1.bma{font-size:50px}.sopn{font-size:32px}}
</style>
<style>
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px 20px;color:var(--soft);font-size:16px}
.spin{width:22px;height:22px;border:3px solid var(--rule);border-top-color:var(--navy2);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sheetwrap{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column}
.sheetbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--navy);color:#F4EFDF}
.sheetbar b{font-family:Fraunces,serif;font-size:18px;font-weight:600}
.sheetwrap iframe{flex:1;border:none;width:100%}
.confirm{position:fixed;inset:0;z-index:90;background:rgba(20,18,14,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.confirm .box{background:#fff;border-radius:16px;padding:24px;max-width:440px;width:100%}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="clockhost"></div>
<script>
/* ====== Paste your Apps Script web app link here (Deploy › Manage deployments › Web app URL, ending in /exec) ====== */
const API = 'https://script.google.com/macros/s/AKfycbzI7fqI3IJpvMWwmSl2NsjHbw93A9x9nL_Wd-MAPXlBHGv0dmbsA2XQoAZWjqweC4Gh/exec';
/* ================================================================================================================== */
const GROUPS=['SAT','Calculus','MYP','Other'];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
let DEV=LS.get('sopaan-device'); if(!DEV){ DEV='d-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); LS.set('sopaan-device',DEV); }
const devName=()=>{ const u=navigator.userAgent; return (/Edg/.test(u)?'Edge':/Chrome/.test(u)?'Chrome':/Safari/.test(u)?'Safari':/Firefox/.test(u)?'Firefox':'Browser')+' on '+(/iPhone|iPad/.test(u)?'iPhone/iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Win/.test(u)?'Windows':'device'); };

let token=LS.get('sopaan-token'), role=LS.get('sopaan-role')||'';
let view={page: token?role:'home', loginRole:'student', tab:''}; let D=null; let catalog=null; let msg=''; let busy=false;
let sel=null, selT=null, enrol={ids:new Set(),prog:'',q:''}, slips=[], mapProg='', mapData=null, clockMini=false, clockTimer=null, poller=null, offset=0;

async function api(action,data){
  if(!/^https:\/\/script\.google\.com\//.test(API)) return {ok:false,msg:'The Hub is not connected yet: paste the web app link into API at the top of index.html.'};
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token},data||{}))});
    const j=await r.json(); if(!j.ok&&j.code==='token'&&action!=='login'){ signOut(j.msg); } return j;
  }catch(e){ return {ok:false,msg:'Could not reach the server. Check your internet and try again.'}; }
}
function toast(t){ msg=t; const old=document.getElementById('toast'); if(old) old.remove(); if(!t) return; const d=document.createElement('div'); d.id='toast'; d.setAttribute('role','status'); d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#211E1A;color:#FBF9F4;padding:11px 18px;border-radius:99px;font-size:14.5px;z-index:95;max-width:92vw;text-align:center'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>{ if(msg===t){ d.remove(); msg=''; } },4500); }
function signOut(m){ token=null; role=''; LS.del('sopaan-token'); LS.del('sopaan-role'); D=null; sel=null; selT=null; clearInterval(poller); view={page:'home',loginRole:view.loginRole||'student'}; render(); if(m) toast(m); }
async function refresh(){ const j=await api('me'); if(j.ok){ D=j; render(); } else if(j.code!=='token'){ toast(j.msg); } }
function header(nav,badge){ return `<header class="top"><div class="bar"><button class="brand" data-home type="button"><span class="crest">S</span><span><span class="bt1">Brain &amp; Mind Academy</span><span class="bt2">Sopaan${nav?' · '+nav:''}</span></span></button>${badge?`<span class="role">${badge}</span>`:''}<span style="flex:1"></span>${token?'<button class="btn ghost sm" data-signout type="button">Sign out</button>':''}</div></header>`; }
const loading=()=>`<div class="loading"><span class="spin" aria-hidden="true"></span>Loading…</div>`;

function render(){
  const app=document.getElementById('app');
  if(view.page==='home') app.innerHTML=homeView();
  else if(!D) app.innerHTML=header('',role)+loading();
  else app.innerHTML= role==='student'?studentView(): role==='teacher'?staffView('teacher'): staffView('admin');
  bind(); drawClock();
}

/* ================= SIGN-IN PAGE ================= */
const SCI=[
 ['∫ sin x dx = −cos x + C',6,12,26,-8],['e^(iπ) + 1 = 0',58,8,24,6],['F = ma',30,70,30,-4],['E = mc²',78,62,28,8],['PV = nRT',14,44,22,-6],
 ['a² + b² = c²',44,88,22,4],['dy/dx',88,30,26,-10],['λ = h/p',70,90,20,0],['Σ 1/n² = π²/6',36,26,20,-5],['2H₂ + O₂ → 2H₂O',2,86,18,3],
 ['v = u + at',90,82,20,-3],['sin²θ + cos²θ = 1',52,46,18,5],['pH = −log[H⁺]',20,96,18,-2],['∇·E = ρ/ε₀',82,4,20,4]
].map(([s,x,y,f,r],i)=>`<span class="fx" style="left:${x}%;top:${y}%;font-size:${f}px;transform:rotate(${r}deg);animation-delay:${-i*1.7}s">${s}</span>`).join('')
 +`<svg class="deco" style="left:48%;top:58%;width:120px" viewBox="0 0 100 100"><polygon points="50,8 86,29 86,71 50,92 14,71 14,29"/><circle cx="50" cy="50" r="22"/><line x1="50" y1="8" x2="50" y2="-6"/><line x1="86" y1="29" x2="98" y2="22"/></svg>`
 +`<svg class="deco" style="left:40%;top:4%;width:110px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="5"/><ellipse cx="50" cy="50" rx="45" ry="16"/><ellipse cx="50" cy="50" rx="45" ry="16" transform="rotate(60 50 50)"/><ellipse cx="50" cy="50" rx="45" ry="16" transform="rotate(120 50 50)"/></svg>`
 +`<svg class="deco" style="left:62%;top:22%;width:200px" viewBox="0 0 200 60"><path d="M0 30 Q 25 0 50 30 T 100 30 T 150 30 T 200 30"/></svg>`
 +`<svg class="deco" style="left:22%;top:62%;width:90px" viewBox="0 0 100 120"><line x1="10" y1="5" x2="90" y2="5"/><line x1="50" y1="5" x2="74" y2="90"/><circle cx="76" cy="98" r="10"/><path d="M50 40 A 35 35 0 0 1 64 37" /></svg>`;

function homeView(){
  const r=view.loginRole;
  const form = r==='student'? `<label class="l" for="sid">Login ID</label><input class="f" id="sid" autocomplete="username" placeholder="e.g. S0001"><label class="l" for="spin">4-digit PIN</label><input class="f mono" id="spin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="••••" style="letter-spacing:.4em;font-size:20px">`
   : `<label class="l" for="em">Email</label><input class="f" id="em" type="email" autocomplete="username"><label class="l" for="pw">Password</label><input class="f" id="pw" type="password" autocomplete="current-password">`;
  const ps=(catalog||[]);
  const chips= ps.length? GROUPS.map(g=>{ const list=ps.filter(p=>p.group===g); if(!list.length) return ''; const label={SAT:'Digital SAT',Calculus:'Pre-calculus & Calculus',MYP:'IB Middle Years (MYP)',Other:'IGCSE, A Level, US & more'}[g];
    return `<div class="pgrp"><h3>${label}<span class="mono">${list.length}</span></h3><div class="chips">${list.map(p=>`<span class="chip">${esc(p.name.replace('Calculus · ',''))}</span>`).join('')}</div></div>`; }).join('') : loading();
  return `<section class="lhero"><div class="sci" aria-hidden="true">${SCI}</div><div class="heroin" style="position:relative">
  <div style="flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:16px">
   <span class="crest" style="width:64px;height:64px;font-size:32px;border-radius:16px">S</span>
   <h1 class="bma">Brain &amp; Mind<br>Academy</h1>
   <div class="sop"><span class="sopn">Sopaan</span><span class="sopt">सोपान · learning, one step at a time</span></div>
   <div class="subj"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7M7.5 3.5v7M14 5l6 6M20 5l-6 6M4 17h7M14 15.5h6M14 18.5h6"/></svg>Mathematics</span><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg>Physics</span><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg>Chemistry</span></div>
   <p style="margin:0">Interactive theory, practice and timed tests, with live classes on Google Meet. Sign in with the login your teacher or academy gave you.</p>
  </div>
  <form class="signin" id="lform"><div class="rtabs" role="tablist">${['student','teacher','admin'].map(x=>`<button type="button" role="tab" aria-selected="${x===r}" class="rtab ${x===r?'on':''}" data-role="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>

function clockTarget(){ if(!D) return null; if(role==='student') return D.session?{s:D.student,sess:D.session}:null;
  const live=(D.students||[]).filter(s=>s.live); if(!live.length) return null; const s=live.find(x=>x.id===sel)||live[0]; return {s,sess:s.live}; }
function drawClock(){
  const host=document.getElementById('clockhost'); const c=clockTarget(); const mins=(D&&D.classMinutes)||55;
  if(!c){ host.innerHTML=''; clearInterval(clockTimer); clockTimer=null; return; }
  const s=c.s, who=role;
  host.innerHTML=`<div id="clock" class="${clockMini?'mini':''}" role="timer" aria-label="Class clock"><span class="lbl">Live class · ${mins} min</span><span class="who">${esc(who==='student'?'with '+(D.student.teacherName||'your teacher'):s.name+' · '+s.id)}</span>
   <div class="ring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="96" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="14"/><circle id="arc" cx="110" cy="110" r="96" fill="none" stroke="#C79A3E" stroke-width="14" stroke-linecap="round" stroke-dasharray="603.2" stroke-dashoffset="0"/></svg><div class="time"><span id="ct">--:--</span><small id="cs">remaining</small></div></div>
   <span class="minitime" id="cm">--:--</span>
   <div class="row full" style="justify-content:center"><a class="cbtn go" href="${esc(s.meet)}" target="_blank" rel="noopener">Google Meet</a>${s.wb?`<a class="cbtn" href="${esc(s.wb)}" target="_blank" rel="noopener">Whiteboard</a>`:''}</div>
   <div class="row" style="justify-content:center;gap:8px"><button class="cbtn" id="cmin" type="button">${clockMini?'Expand':'Minimise'}</button>${who!=='student'?'<button class="cbtn" id="cend" type="button">End class</button>':''}</div></div>`;
  document.getElementById('cmin').onclick=()=>{ clockMini=!clockMini; drawClock(); };
  const ce=document.getElementById('cend'); if(ce) ce.onclick=async()=>{ const j=await api('classEnd',{sid:s.id}); if(j.ok){ s.live=null; toast('Class ended.'); render(); } else toast(j.msg); };
  const tick=()=>{ const el=document.getElementById('ct'); if(!el) return; const left=Math.max(0,mins*60-Math.floor((Date.now()+offset-c.sess.start)/1000)); const t=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
    el.textContent=t; document.getElementById('cm').textContent=t; const arc=document.getElementById('arc'); arc.setAttribute('stroke-dashoffset',String(603.2*(1-left/(mins*60))));
    document.getElementById('cs').textContent= left===0?"time's up":left<=300?'last 5 minutes':'remaining'; if(left<=300) arc.setAttribute('stroke', left===0?'#E38884':'#E0B75B'); };
  tick(); clearInterval(clockTimer); clockTimer=setInterval(tick,1000);
}

  let right=loading();
  if(mapData&&mapData.program.id===mapProg){ let ph='',rows=''; mapData.items.forEach(it=>{ if(it.section!==ph){ ph=it.section; rows+=`<div class="phase">${esc(ph||'Items')}</div>`; } rows+=`<div class="it"><span class="n mono">${String(it.step).padStart(2,'0')}</span><div class="t"><b>${esc(it.title)}</b><span>${esc(it.type)} · <span class="mono">${esc(it.id)}</span></span></div></div>`; });
    right=`<div class="card"><span class="mono" style="font-size:12.5px;color:var(--goldtx);font-weight:600">${esc(mapProg)} · ${mapData.items.length} ITEMS · ${D.students.filter(s=>s.prog===mapProg).length} ENROLLED</span><h2 style="font-size:26px;margin:6px 0">${esc(mapData.program.name)}</h2><p style="margin:0;color:var(--soft);font-size:15px;line-height:1.5">${esc(mapData.program.notes||'')}</p></div><div class="tbox list">${rows||'<div class="it" style="color:var(--soft)">No items.</div>'}</div>`; }
  else loadMap(mapProg);
  return `<div class="row" style="align-items:flex-start;gap:20px"><div class="card" style="flex:1 1 280px;padding:12px;max-height:72vh;overflow:auto">${GROUPS.filter(g=>list.some(x=>x.group===g)).map(g=>`<div class="prog-h" style="margin:10px 8px 6px">${g==='Other'?'More':g}</div>`+list.filter(x=>x.group===g).map(x=>`<button type="button" data-map="${esc(x.id)}" style="display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:${x.id===mapProg?'#EEF2F8':'none'};border:none;border-radius:8px;padding:9px 10px;font-size:14.5px;color:var(--ink)"><span>${esc(x.name.replace('Calculus · ',''))}</span><span class="mono" style="color:var(--soft);font-size:12.5px">${x.count}</span></button>`).join('')).join('')}</div><div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:12px">${right}</div></div>`;
}
let mapLoading='';
async function loadMap(id){ if(mapLoading===id) return; mapLoading=id; const j=await api('program',{prog:id}); mapLoading=''; if(j.ok){ mapData=j; if(view.tab==='map') render(); } else toast(j.msg); }
function aTeachers(){ const T=selT&&(D.teachers||[]).find(t=>t.id===selT); const all=D.programs||[];
  const rows=(D.teachers||[]).map(x=>`<tr ${selT===x.id?'style="background:#FBF7EC"':''}><td><b>${esc(x.name)}</b><br><span class="mono" style="font-size:12.5px;color:var(--soft)">${esc(x.id)}</span></td><td>${esc(x.email)}</td><td>${x.progs.length?esc(x.progs.slice(0,3).map(pname).join(', '))+(x.progs.length>3?' +'+(x.progs.length-3)+' more':''):'<span style="color:var(--soft)">None yet</span>'}</td><td class="mono">${D.students.filter(s=>s.teacher===x.id).length}</td><td>${x.status==='Active'?'<span class="pill p-ok">Active</span>':'<span class="pill p-mute">Paused</span>'}</td><td><button class="btn ghost sm" data-tsel="${esc(x.id)}" type="button">Programs</button></td></tr>`).join('');
  const side= T? `<aside class="card" style="flex:1 1 380px;display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--goldtx);font-weight:700">Programs for this teacher</span><h2 style="font-size:24px">${esc(T.name)} · ${esc(T.id)}</h2><p style="margin:0;color:var(--soft);font-size:14.5px">Tick the programs this teacher may teach, then Save.</p>
    <div style="max-height:50vh;overflow:auto;border:1px solid #EFE8D6;border-radius:10px;padding:4px 12px">${GROUPS.map(g=>{ const ps=all.filter(p=>p.group===g); if(!ps.length) return ''; return `<div class="row" style="justify-content:space-between;margin-top:10px"><span class="prog-h" style="margin:0">${g==='Other'?'More':g}</span><button class="btn ghost sm" data-tgall="${g}" type="button">Select all</button></div>`+ps.map(p=>`<label style="display:flex;gap:10px;align-items:center;padding:7px 0;font-size:15px"><input type="checkbox" data-tprog="${esc(p.id)}" data-g="${g}" ${T.progs.includes(p.id)?'checked':''} style="width:18px;height:18px;accent-color:var(--navy2)"><span>${esc(p.name)}</span></label>`).join(''); }).join('')}</div>
    <div class="row"><button class="btn" data-act="savetp" type="button">Save programs</button><button class="btn ghost sm" data-act="tpause" type="button">${T.status==='Active'?'Pause teacher':'Re-activate'}</button><button class="btn ghost sm" data-act="tpw" type="button">Set new password</button></div></aside>`
   : `<form class="card" id="tadd" style="flex:1 1 320px"><h2 style="font-size:22px">Add teacher</h2><label class="l" for="tn">Name</label><input class="f" id="tn" required><label class="l" for="te">Email</label><input class="f" id="te" type="email" required><label class="l" for="tp">Temporary password</label><input class="f" id="tp" value="sopaan2026"><button class="btn" type="submit" style="margin-top:14px">Add teacher</button><p style="font-size:14px;color:var(--soft);margin:12px 0 0">Then click Programs on their row to give them programs.</p></form>`;
  return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h1 style="font-size:32px">Teachers &amp; programs</h1><span style="color:var(--soft)">You give programs to teachers. Teachers enrol their students in those programs.</span></div>${T?'<button class="btn" data-tsel="" type="button">Add teacher</button>':''}</div>
  <div class="row" style="align-items:flex-start;gap:20px"><div class="tbox" style="flex:999 1 600px"><table><thead><tr><th>Teacher</th><th>Email</th><th>Programs</th><th>Students</th><th>Status</th><th><span class="sr">Actions</span></th></tr></thead><tbody>${rows||'<tr><td colspan="6" style="color:var(--soft)">No teachers yet.</td></tr>'}</tbody></table></div>${side}</div>`; }
function addProgTab(){ return `<h1 style="font-size:32px">Add a new program</h1><p style="color:var(--soft);margin:4px 0 18px;max-width:760px">Paste one item per line as <span class="mono">Title | Link | Type | Section</span>, in teaching order. Item IDs are made for you (<span class="mono">PROGRAMID-01</span>, -02 …). Then run Sopaan › Import sheet files in the Google Sheet, and give the program to teachers.</p>
  <form class="card" id="padd" style="max-width:820px"><div class="row" style="align-items:flex-start"><div style="flex:1 1 160px"><label class="l" for="pid">Program ID</label><input class="f mono" id="pid" placeholder="e.g. APSTAT"></div><div style="flex:3 1 260px"><label class="l" for="pname">Program name</label><input class="f" id="pname" placeholder="e.g. AP Statistics"></div></div>
   <div class="row" style="align-items:flex-start"><div style="flex:1 1 180px"><label class="l" for="pgrp">Group</label><select class="f" id="pgrp">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select></div><div style="flex:2 1 220px"><label class="l" for="pboard">Board / exam</label><input class="f" id="pboard"></div></div>
   <label class="l" for="pnote">Short description</label><input class="f" id="pnote"><label class="l" for="prows">Items (one per line)</label><textarea class="f mono" id="prows" rows="8" placeholder="Exploring one-variable data | https://brainmind2047.github.io/... | Chapter sheet | Unit 1"></textarea>
   <div id="perr"></div><button class="btn" type="submit" style="margin-top:14px">Save program</button></form>`; }

/* ================= EVENTS ================= */
function bind(){
  const app=document.getElementById('app'), $=q=>app.querySelector(q), on=(q,f)=>{ const e=$(q); if(e) e.onclick=f; };
  app.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{ if(!token){ view.page='home'; render(); } });
  app.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{ view.loginRole=b.dataset.role; render(); });
  const lf=$('#lform'); if(lf) lf.onsubmit=e=>{ e.preventDefault(); if(!busy) doLogin(); };
  on('[data-signout]',()=>signOut());
  on('[data-reload]',()=>{ D=null; render(); refresh(); });
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSheet(b.dataset.open));
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; sel=null; render(); });
  app.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{ sel=b.dataset.sel; render(); });
  app.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{ mapProg=b.dataset.map; render(); });
  app.querySelectorAll('[data-start]').forEach(a=>a.addEventListener('click',()=>startClass(a.dataset.start)));
  const s=sel&&D&&(D.students||[]).find(x=>x.id===sel);
  const done=async(j,ok)=>{ if(j.ok){ if(ok) toast(ok); await refresh(); } else toast(j.msg); };
  if(s){
    on('[data-act=save]',async()=>{ const b={sid:s.id,name:$('#ename').value,prog:$('#eprog').value,meet:$('#emeet').value.trim(),wb:$('#ewb').value.trim()}; const et=$('#etch'); if(et) b.teacher=et.value; done(await api('saveStudent',b),'Saved.'); });
    on('[data-act=pin]',async()=>{ const j=await api('resetPin',{sid:s.id}); done(j,j.ok?'New PIN for '+s.id+': '+j.pin:''); });
    on('[data-act=pause]',async()=>done(await api('saveStudent',{sid:s.id,status:s.status==='Active'?'Paused':'Active'})));
    on('[data-act=del]',()=>confirmBox('Delete '+s.id+'?','This removes the student\'s login. Their past attempts stay in the sheet.','Delete',async()=>{ sel=null; done(await api('deleteStudent',{sid:s.id}),'Deleted.'); }));
    app.querySelectorAll('[data-rmdev]').forEach(b=>b.onclick=async()=>done(await api('removeDevice',{sid:s.id,device:b.dataset.rmdev}),'Device removed.'));
    app.querySelectorAll('[data-reatt]').forEach(b=>b.onclick=async()=>done(await api('resetAttempt',{sid:s.id,item:b.dataset.reatt}),'Re-attempt allowed.'));
  }
  app.querySelectorAll('[data-pick]').forEach(c=>c.onchange=()=>{ c.checked?enrol.ids.add(c.dataset.pick):enrol.ids.delete(c.dataset.pick); render(); });
  app.querySelectorAll('input[name=eprog]').forEach(r=>r.onchange=()=>{ enrol.prog=r.value; render(); });
  const pq=$('#pq'); if(pq) pq.oninput=()=>{ enrol.q=pq.value; const p=pq.selectionStart; render(); const n=document.getElementById('pq'); n.focus(); n.setSelectionRange(p,p); };
  on('[data-act=newstu]',async()=>{ const nm=$('#nname').value.trim(); if(!nm){ toast('Type a name first.'); return; } const nt=$('#ntch'); const j=await api('createStudent',{name:nm,teacher:nt?nt.value:''}); if(j.ok){ enrol.ids.add(j.student.id); } done(j,j.ok?'Created '+j.student.id+' (PIN '+j.student.pin+').':''); });
  on('[data-act=doenrol]',async()=>{ const j=await api('enrol',{sids:[...enrol.ids],prog:enrol.prog}); if(j.ok){ slips=j.enrolled; enrol.ids=new Set(); } done(j,j.ok?'Enrolled '+j.enrolled.length+'.':''); });
  on('[data-act=copyslips]',()=>{ const t=slips.map(x=>`${x.name}\nLogin ID: ${x.id}   PIN: ${x.pin}\nProgram: ${pname(x.prog)}\n`).join('\n'); try{ navigator.clipboard.writeText(t).then(()=>toast('Slips copied.'),()=>toast('Copy was blocked.')); }catch(e){ toast('Copy was blocked.'); } });
  app.querySelectorAll('[data-tsel]').forEach(b=>b.onclick=()=>{ selT=b.dataset.tsel||null; render(); });
  app.querySelectorAll('[data-tgall]').forEach(b=>b.onclick=()=>{ app.querySelectorAll(`[data-tprog][data-g="${b.dataset.tgall}"]`).forEach(c=>c.checked=true); });
  on('[data-act=savetp]',async()=>{ const progs=[...app.querySelectorAll('[data-tprog]')].filter(c=>c.checked).map(c=>c.dataset.tprog); done(await api('setTeacherPrograms',{tid:selT,progs}),'Programs saved.'); });
  on('[data-act=tpause]',async()=>{ const T=D.teachers.find(t=>t.id===selT); done(await api('saveTeacher',{tid:selT,status:T.status==='Active'?'Paused':'Active'})); });
  on('[data-act=tpw]',async()=>{ const pw='sop-'+Math.random().toString(36).slice(2,8); const j=await api('saveTeacher',{tid:selT,password:pw}); done(j,j.ok?'New password for '+selT+': '+pw:''); });
  const ta=$('#tadd'); if(ta) ta.onsubmit=async e=>{ e.preventDefault(); const j=await api('saveTeacher',{name:$('#tn').value,email:$('#te').value,password:$('#tp').value}); if(j.ok) selT=j.teacher.id; done(j,j.ok?'Teacher added. Now give them programs.':''); };
  const pa=$('#padd'); if(pa) pa.onsubmit=async e=>{ e.preventDefault(); const items=$('#prows').value.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const [title,link,type,section]=l.split('|').map(x=>(x||'').trim()); return {title,link,type,section}; });
    const j=await api('addProgram',{id:$('#pid').value,name:$('#pname').value,group:$('#pgrp').value,board:$('#pboard').value,notes:$('#pnote').value,items});
    if(j.ok){ toast('Program added with '+j.added+' items. Import its files from the Google Sheet menu.'); view.tab='teachers'; refresh(); } else $('#perr').innerHTML='<div class="err">'+esc(j.msg)+'</div>'; };
}

/* ================= START ================= */
render();
(async()=>{ const j=await api('catalog'); if(j.ok){ catalog=j.programs; if(view.page==='home') render(); } })();
if(token){ refresh().then(startPolling); }
</script>
</body>
</html>
