<style>
:root{--navy:#16264A;--navy2:#1F3B6B;--gold:#C79A3E;--goldtx:#8A661F;--goldlt:#E0C27F;--paper:#FBF9F4;--paper2:#F1EAD8;--ink:#211E1A;--soft:#655D4C;--rule:#E4DCC8;--ok:#2E6B47;--okbg:#E1F2E7;--bad:#8A3B1F;--badbg:#F9ECE7;--info:#1F3B6B;--infobg:#E7F1FB;--plum:#4B3A7A;--plumbg:#EFEDFF}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;color:var(--navy)}
.mono{font-family:'IBM Plex Mono',monospace}a{color:var(--navy2)}button{font-family:inherit;cursor:pointer}
.demo{background:#2B2417;color:#F4EFDF;font-size:13.5px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.demo b{color:var(--goldlt)}.demo button{background:transparent;color:#F4EFDF;border:1px solid rgba(244,239,223,.35);border-radius:7px;padding:5px 10px;font-size:13px}.demo .sp{flex:1}
header.top{background:var(--navy);color:#F4EFDF}
.bar{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px;color:#F4EFDF;background:none;border:none;padding:0}
.crest{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:700;font-size:20px}
.bt1{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--goldlt);font-weight:700;display:block;text-align:left}
.bt2{font-family:Fraunces,serif;font-size:20px;font-weight:600;display:block;text-align:left}
.role{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:rgba(224,194,127,.18);color:var(--goldlt)}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 90px}
.card{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:22px}
.btn{border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--navy2);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #D9D0BA}.btn.green{background:#2E6B47;color:#fff}.btn.sm{padding:8px 12px;font-size:13.5px}.btn:disabled{opacity:.45;cursor:not-allowed}
label.l{display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin:12px 0 6px}
input.f,select.f,textarea.f{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #D9D0BA;border-radius:10px;background:var(--paper);color:var(--ink)}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px var(--paper2)}
.note{display:flex;gap:10px;background:var(--paper2);border-radius:10px;padding:11px 12px;font-size:14px;color:#5A4A24;line-height:1.45}
.err{background:var(--badbg);color:var(--bad);border-radius:10px;padding:11px 12px;font-size:14.5px;margin-top:12px}
.okm{background:var(--okbg);color:var(--ok);border-radius:10px;padding:11px 12px;font-size:14.5px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-bad{background:var(--badbg);color:var(--bad)}.p-info{background:var(--infobg);color:var(--info)}.p-mute{background:#F0EFEC;color:#4A463E}.p-gold{background:var(--paper2);color:#5A4A24}.p-live{background:#E1F2E7;color:#1F5A37}
.hero{background:var(--navy);color:#F4EFDF}
.heroin{max-width:1240px;margin:0 auto;padding:44px 20px 60px;display:flex;flex-wrap:wrap;gap:36px;align-items:center}
.heroin h1{color:#F4EFDF;font-size:50px;line-height:1.04}.heroin p{color:#CFD7EA;font-size:18px;line-height:1.6;max-width:520px}
.signin{flex:1 1 360px;max-width:440px;background:#fff;color:var(--ink);border-radius:18px;padding:24px;box-shadow:0 24px 60px rgba(8,14,32,.35)}
.rtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--paper2);padding:5px;border-radius:12px;margin-bottom:6px}
.rtab{border:none;background:none;border-radius:9px;padding:10px 6px;font-weight:700;font-size:14.5px;color:var(--soft)}.rtab.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);padding:12px 14px;border-bottom:1px solid var(--rule)}
td{padding:12px 14px;border-bottom:1px solid #EFE8D6;vertical-align:middle}
.tbox{background:#fff;border:1px solid var(--rule);border-radius:14px;overflow-x:auto}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.list .it{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:14px 18px;border-bottom:1px solid #EFE8D6}.list .it:last-child{border-bottom:none}
.it .n{width:38px;color:var(--soft);font-size:13px}.it .t{flex:1 1 260px;min-width:0}.it .t b{display:block;font-size:16px}.it .t span{font-size:13.5px;color:var(--soft)}
.phase{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--goldtx);padding:16px 18px 6px;background:#FCFAF4;border-bottom:1px solid #EFE8D6}
.overlay{position:fixed;inset:0;background:rgba(20,18,14,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:18px;max-width:680px;width:100%;max-height:90vh;overflow:auto;position:relative}
.wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.09;display:flex;flex-wrap:wrap;align-content:flex-start;gap:40px 60px;padding:20px;transform:rotate(-18deg) scale(1.3)}.wm span{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--navy);white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14.5px;color:var(--soft)}.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.radio{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;font-size:15px;cursor:pointer;background:#fff}.radio.on{border:2px solid var(--navy2);background:#EEF2F8}.radio input{width:18px;height:18px;accent-color:var(--navy2)}
.prog-h{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--goldtx);margin:14px 0 8px}
.slip{border:1.5px dashed #C9BE9F;border-radius:12px;padding:14px 16px;background:#fff;flex:0 1 300px}
.sr{position:absolute;left:-9999px}
/* class clock */
#clock{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);background:var(--navy);color:#F4EFDF;border-radius:24px;padding:26px 26px 22px;box-shadow:0 30px 80px rgba(8,14,32,.5);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
#clock.mini{top:12px;transform:translateX(-50%);width:auto;flex-direction:row;padding:8px 10px 8px 16px;border-radius:99px;gap:12px}
#clock .lbl{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--goldlt);font-weight:700}
#clock .who{font-family:Fraunces,serif;font-size:20px}
#clock .ring{position:relative;width:220px;height:220px}
#clock .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
#clock .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:600}
#clock .time small{font-family:'Source Sans 3',sans-serif;font-size:13px;color:#CFD7EA;font-weight:600;letter-spacing:.04em}
#clock.mini .ring,#clock.mini .who,#clock.mini .lbl,#clock.mini .full{display:none}
#clock .minitime{display:none;font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600}
#clock.mini .minitime{display:block}
#clock .cbtn{background:rgba(255,255,255,.1);color:#F4EFDF;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
#clock .cbtn.go{background:var(--gold);color:var(--navy);border-color:var(--gold)}
#clock.mini .cbtn{padding:6px 10px;font-size:13px}
@media (max-width:640px){.heroin h1{font-size:36px}}

.lhero{background:radial-gradient(1200px 500px at 80% -10%,#24407A 0%,transparent 60%),var(--navy);color:#F4EFDF;position:relative;overflow:hidden}
.sci{position:absolute;inset:0;pointer-events:none}
.sci .fx{position:absolute;font-family:'IBM Plex Mono',monospace;color:#E0C27F;opacity:.16;white-space:nowrap;animation:drift 14s ease-in-out infinite alternate}
.sci .deco{position:absolute;fill:none;stroke:#9FB4DC;stroke-width:2;opacity:.18}
@keyframes drift{from{translate:0 0}to{translate:0 -14px}}
@media (prefers-reduced-motion:reduce){.sci .fx{animation:none}}
.lhero .heroin{padding:48px 20px 64px}
.heroin h1.bma,.bma{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:76px;line-height:.98;letter-spacing:-.015em;color:#F4EFDF;margin:0}
.sop{display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--gold);padding-left:14px}
.sopn{font-family:Fraunces,serif;font-size:40px;font-weight:600;color:var(--gold);line-height:1.1}
.sopt{font-size:15px;letter-spacing:.06em;color:#CFD7EA}
.subj{display:flex;flex-wrap:wrap;gap:10px}
.subj span{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:8px 14px;font-weight:700;font-size:15px}
.subj svg{width:20px;height:20px;fill:none;stroke:#E0C27F;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lhero p{color:#CFD7EA;font-size:17px;line-height:1.6;max-width:520px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pgrp{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:20px}
.pgrp h3{font-size:20px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:12px}
.pgrp h3 .mono{font-size:13px;color:var(--goldtx);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;padding:6px 11px;border-radius:8px;background:var(--paper2);color:#3A342A}
@media (max-width:640px){.heroin h1.bma{font-size:50px}.sopn{font-size:32px}}
</style>
<style>
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px 20px;color:var(--soft);font-size:16px}
.spin{width:22px;height:22px;border:3px solid var(--rule);border-top-color:var(--navy2);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sheetwrap{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column}
.sheetbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--navy);color:#F4EFDF}
.sheetbar b{font-family:Fraunces,serif;font-size:18px;font-weight:600}
.sheetwrap iframe{flex:1;border:none;width:100%}
.confirm{position:fixed;inset:0;z-index:90;background:rgba(20,18,14,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.confirm .box{background:#fff;border-radius:16px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.notice{display:flex;gap:10px;align-items:flex-start;background:#FFF7E3;border:1px solid #EBD9A6;border-radius:12px;padding:12px 14px;font-size:15px;color:#4A3B17}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--paper2);color:#5A4A24}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),#EFE8D6 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring span{width:70px;height:70px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font:600 18px 'IBM Plex Mono',monospace;color:var(--navy)}
.stat{display:flex;flex-direction:column;gap:2px;min-width:90px}.stat b{font-family:Fraunces,serif;font-size:28px;color:var(--navy)}.stat span{font-size:13.5px;color:var(--soft)}
.att{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid #EFE8D6}.att:last-child{border-bottom:none}
.seclabel{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--goldtx);font-weight:700}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="clockhost"></div>
<script>
/* ====== Paste your Apps Script web app link here (Deploy › Manage deployments › Web app URL, ending in /exec) ====== */
const API = 'https://script.google.com/macros/s/AKfycbzI7fqI3IJpvMWwmSl2NsjHbw93A9x9nL_Wd-MAPXlBHGv0dmbsA2XQoAZWjqweC4Gh/exec';
/* ================================================================================================================== */
const GROUPS=['CBSE','SAT','Calculus','MYP','Other'];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
let DEV=LS.get('sopaan-device'); if(!DEV){ DEV='d-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); LS.set('sopaan-device',DEV); }
const devName=()=>{ const u=navigator.userAgent; return (/Edg/.test(u)?'Edge':/Chrome/.test(u)?'Chrome':/Safari/.test(u)?'Safari':/Firefox/.test(u)?'Firefox':'Browser')+' on '+(/iPhone|iPad/.test(u)?'iPhone/iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Win/.test(u)?'Windows':'device'); };

let token=LS.get('sopaan-token'), role=LS.get('sopaan-role')||'';
const REF=new URLSearchParams(location.search).get('ref'); let refInfo=null, refDone=null;
let view={page: REF?'refer':token?role:'home', loginRole:'student', tab:''}; let D=null; let catalog=null; let msg=''; let busy=false;
let sel=null, selT=null, enrol={ids:new Set(),prog:'',q:''}, slips=[], mapProg='', mapData=null, clockMini=false, clockTimer=null, poller=null, offset=0;

async function api(action,data){
  if(!/^https:\/\/script\.google\.com\//.test(API)) return {ok:false,msg:'The Hub is not connected yet: paste the web app link into API at the top of index.html.'};
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token},data||{}))});
    const j=await r.json(); if(!j.ok&&j.code==='token'&&action!=='login'){ signOut(j.msg); } return j;
  }catch(e){ return {ok:false,msg:'Could not reach the server. Check your internet and try again.'}; }
}
function toast(t){ msg=t; const old=document.getElementById('toast'); if(old) old.remove(); if(!t) return; const d=document.createElement('div'); d.id='toast'; d.setAttribute('role','status'); d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#211E1A;color:#FBF9F4;padding:11px 18px;border-radius:99px;font-size:14.5px;z-index:95;max-width:92vw;text-align:center'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>{ if(msg===t){ d.remove(); msg=''; } },4500); }
function signOut(m){ token=null; role=''; LS.del('sopaan-token'); LS.del('sopaan-role'); D=null; sel=null; selT=null; clearInterval(poller); view={page:'home',loginRole:view.loginRole||'student'}; render(); if(m) toast(m); }
async function refresh(){ const j=await api('me'); if(j.ok){ D=j; render(); } else if(j.code!=='token'){ toast(j.msg); } }
function header(nav,badge){ return `<header class="top"><div class="bar"><button class="brand" data-home type="button"><span class="crest">S</span><span><span class="bt1">Brain &amp; Mind Academy</span><span class="bt2">Sopaan${nav?' · '+nav:''}</span></span></button>${badge?`<span class="role">${badge}</span>`:''}<span style="flex:1"></span>${token?'<button class="btn ghost sm" data-signout type="button">Sign out</button>':''}</div></header>`; }
const loading=()=>`<div class="loading"><span class="spin" aria-hidden="true"></span>Loading…</div>`;

function render(){
  const app=document.getElementById('app');
  if(view.page==='refer'){ app.innerHTML=referView(); bindRefer(); return; }
  if(view.page==='home') app.innerHTML=homeView();
  else if(!D) app.innerHTML=header('',role)+loading();
  else app.innerHTML= role==='student'?studentView(): role==='teacher'?staffView('teacher'): staffView('admin');
  bind(); drawClock();
}

/* ================= REFER A FRIEND (link from the monthly report; no sign-in) ================= */
function referView(){
  const top=`<header class="top"><div class="bar"><span class="brand"><span class="crest">S</span><span><span class="bt1">Brain &amp; Mind Academy</span><span class="bt2">Sopaan</span></span></span></div></header>`;
  let body;
  if(!refInfo) body=loading();
  else if(!refInfo.ok) body=`<div class="card"><h1 style="font-size:28px">Link not valid</h1><p style="color:var(--soft)">${esc(refInfo.msg)}</p></div>`;
  else if(refDone) body=`<div class="card" style="text-align:center;padding:36px 24px"><div style="font-size:44px" aria-hidden="true">🎉</div><h1 style="font-size:30px;margin-top:6px">Thank you${refInfo.parent?', '+esc(refInfo.parent):''}!</h1><p style="color:var(--soft);font-size:16px;max-width:460px;margin:10px auto 0">We have your referral for <b>${esc(refDone)}</b>. Our team will get in touch with them soon.</p><button class="btn ghost" type="button" id="rfmore" style="margin-top:18px">Refer another friend</button></div>`;
  else body=`<form class="card" id="rfform" novalidate><span class="seclabel">Refer a friend</span><h1 style="font-size:30px;margin:6px 0 4px">Know a family who would enjoy Sopaan?</h1><p style="color:var(--soft);margin:0 0 6px">${refInfo.student?esc(refInfo.student)+' learns with us. ':''}Share a friend's details and our team will contact them.</p>
    <label class="l" for="rfp">Your name</label><input class="f" id="rfp" value="${esc(refInfo.parent)}" autocomplete="name">
    <label class="l" for="rfn">Friend's name</label><input class="f" id="rfn" required>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px"><div><label class="l" for="rfph">Friend's phone (with country code)</label><input class="f" id="rfph" type="tel" placeholder="+91 98765 43210"></div><div><label class="l" for="rfe">Friend's email</label><input class="f" id="rfe" type="email"></div></div>
    <label class="l" for="rfi">Interested in</label><select class="f" id="rfi"><option value="">Not sure yet</option>${(refInfo.groups||[]).map(g=>`<option>${esc(g)}</option>`).join('')}</select>
    <label class="l" for="rfm">Anything we should know? (optional)</label><textarea class="f" id="rfm" rows="3" placeholder="e.g. Grade 10, preparing for SAT next year"></textarea>
    <div id="rferr"></div><button class="btn" type="submit" style="margin-top:14px">Send referral</button></form>`;
  return top+`<div class="wrap" style="max-width:640px">${body}</div>`;
}
function bindRefer(){
  if(!refInfo){ if(!window._refLoading){ window._refLoading=1; api('referInfo',{ref:REF}).then(j=>{ refInfo=j; render(); }); } return; }
  const m=document.getElementById('rfmore'); if(m) m.onclick=()=>{ refDone=null; render(); };
  const f=document.getElementById('rfform'); if(!f) return;
  f.onsubmit=async e=>{ e.preventDefault(); const g=id=>document.getElementById(id).value.trim(), b=f.querySelector('button[type=submit]');
    const body={ref:REF,parentName:g('rfp'),friendName:g('rfn'),friendPhone:g('rfph'),friendEmail:g('rfe'),interest:g('rfi'),message:g('rfm')};
    b.disabled=true; b.textContent='Sending…'; const j=await api('refer',body);
    if(j.ok){ refDone=body.friendName; render(); } else { b.disabled=false; b.textContent='Send referral'; document.getElementById('rferr').innerHTML='<div class="err" role="alert">'+esc(j.msg)+'</div>'; } };
}

function famOf(p){ const id=p.id||'', n=(p.name||'')+' '+(p.board||'');
  if(p.group==='CBSE'||/^CBSE|^CALC-CBSE/.test(id)) return 'cbse';
  if(p.group==='SAT'||/^SAT/.test(id)) return 'dsat';
  if(/^CALC-(APPRE|APAB|APBC|PRE)$/.test(id)) return 'apcalc';
  if(/physics/i.test(n)||id==='APPHY') return 'apphy';
  if(/IGCSE/i.test(n)||id==='IG') return 'igcse';
  if(p.group==='MYP'||/^MYP|^CALC-IB/.test(id)||/\bIB\b/.test(n)) return 'ib';
  if(/A Level|Pure Year/i.test(n)) return 'alevel';
  if(/^(ALG1|ALG2|GEOM|USCC)$/.test(id)||/Common Core/i.test(n)||/(^|\s)US ·/.test(p.board||'')) return 'uscc';
  return 'other'; }
function cbseClass(p){ const n=p.name; if(/Bridge/.test(n)) return 85; const m=n.match(/Class (\d+|XII|XI)\b/); const c=!m?99:m[1]==='XI'?11:m[1]==='XII'?12:+m[1]; return c*10+(/Bridge/.test(n)?8.5:0)+(/Chapter sheets/.test(n)?0.5:0); }

const ZONES={IST:'Asia/Kolkata',EST:'America/New_York',CST:'America/Chicago',PST:'America/Los_Angeles',Dubai:'Asia/Dubai'};
const ZNAME={IST:'India (IST)',EST:'US Eastern (EST/EDT)',CST:'US Central (CST/CDT)',PST:'US Pacific (PST/PDT)',Dubai:'Dubai (GST)'};
let VIEWZ=LS.get('sopaan-viewzone')||''; const vz=()=>VIEWZ&&ZONES[VIEWZ]?{timeZone:ZONES[VIEWZ]}:{};
const vzLabel=()=>VIEWZ&&ZONES[VIEWZ]?VIEWZ:'your time';
function zoneSwitch(){ return `<label style="display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--soft)">Show times in <select class="f" data-viewzone style="width:auto;padding:7px 10px;font-size:14px"><option value="">My time</option>${Object.keys(ZONES).map(k=>`<option value="${k}" ${VIEWZ===k?'selected':''}>${ZNAME[k]}</option>`).join('')}</select></label>`; }
function inZone(ms,lab){ return new Date(ms).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',timeZone:ZONES[lab]})+' '+lab; }
function fmtWhen(ms){ const d=new Date(ms); return d.toLocaleDateString(undefined,Object.assign({weekday:'short',day:'numeric',month:'short'},vz()))+' · '+d.toLocaleTimeString(undefined,Object.assign({hour:'numeric',minute:'2-digit'},vz())); }
function fmtTime(ms){ return new Date(ms).toLocaleTimeString(undefined,Object.assign({hour:'numeric',minute:'2-digit'},vz())); }
function rel(ms){ const now=Date.now(), diff=ms-now; if(diff<=0) return 'now'; const sameDay=a=>new Date(a).toDateString(); if(sameDay(ms)===sameDay(now)){ const h=Math.floor(diff/3600000), m=Math.round((diff%3600000)/60000); return h?'in '+h+' h '+m+' min':'in '+m+' min'; }
  const days=Math.round((new Date(new Date(ms).toDateString())-new Date(new Date(now).toDateString()))/86400000); return days===1?'tomorrow':'in '+days+' days'; }
function slotText(s){ const z=' '+(s.tz||''); return s.type==='Once'? 'One class on '+s.date+' at '+s.time+z : 'Every '+s.days.join(', ')+' at '+s.time+z+(s.from?' from '+s.from:'')+(s.until?' until '+s.until:''); }
function gcal(slot,title,details){ if(!slot.nextStart) return ''; const z=ms=>new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+z(slot.nextStart)+'/'+z(slot.nextStart+slot.minutes*60000)+'&details='+encodeURIComponent(details);
  if(slot.type==='Weekly'){ const by=slot.days.map(d=>d.slice(0,2).toUpperCase()).join(','); u+='&recur='+encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY='+by+(slot.until?';UNTIL='+slot.until.replace(/-/g,'')+'T235959Z':'')); }
  return u; }

  else { if(!document.querySelector('input:focus,textarea:focus,select:focus')) refresh(); } }, role==='student'?10000:20000); }

async function startClass(sid){ const j=await api('classStart',role==='student'?{}:{sid}); if(!j.ok){ toast(j.msg); return; } clockMini=false;
  if(role==='student'){ D.session=j.session; } else { const s=D.students.find(x=>x.id===sid); if(s) s.live=j.session; } render(); }
function clockTarget(){ if(!D) return null; if(role==='student') return D.session?{s:D.student,sess:D.session}:null;
  const live=(D.students||[]).filter(s=>s.live); if(!live.length) return null; const s=live.find(x=>x.id===sel)||live[0]; return {s,sess:s.live}; }
function drawClock(){
  const host=document.getElementById('clockhost'); const c=clockTarget(); const mins=(D&&D.classMinutes)||55;
  if(!c){ host.innerHTML=''; clearInterval(clockTimer); clockTimer=null; return; }
  const s=c.s, who=role;
  host.innerHTML=`<div id="clock" class="${clockMini?'mini':''}" role="timer" aria-label="Class clock"><span class="lbl">Live class · ${mins} min</span><span class="who">${esc(who==='student'?'with '+(D.student.teacherName||'your teacher'):s.name+' · '+s.id)}</span>
   <div class="ring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="96" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="14"/><circle id="arc" cx="110" cy="110" r="96" fill="none" stroke="#C79A3E" stroke-width="14" stroke-linecap="round" stroke-dasharray="603.2" stroke-dashoffset="0"/></svg><div class="time"><span id="ct">--:--</span><small id="cs">remaining</small></div></div>
   <span class="minitime" id="cm">--:--</span>
   <div class="row full" style="justify-content:center"><a class="cbtn go" href="${esc(s.meet)}" target="_blank" rel="noopener">Google Meet</a>${s.wb?`<a class="cbtn" href="${esc(s.wb)}" target="_blank" rel="noopener">Whiteboard</a>`:''}</div>
   <div class="row" style="justify-content:center;gap:8px"><button class="cbtn" id="cmin" type="button">${clockMini?'Expand':'Minimise'}</button>${who!=='student'?'<button class="cbtn" id="cend" type="button">End class</button>':''}</div></div>`;
  document.getElementById('cmin').onclick=()=>{ clockMini=!clockMini; drawClock(); };
  const ce=document.getElementById('cend'); if(ce) ce.onclick=()=>endClassBox(s);
  const tick=()=>{ const el=document.getElementById('ct'); if(!el) return; const left=Math.max(0,mins*60-Math.floor((Date.now()+offset-c.sess.start)/1000)); const t=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
    el.textContent=t; document.getElementById('cm').textContent=t; const arc=document.getElementById('arc'); arc.setAttribute('stroke-dashoffset',String(603.2*(1-left/(mins*60))));
    document.getElementById('cs').textContent= left===0?"time's up":left<=300?'last 5 minutes':'remaining'; if(left<=300) arc.setAttribute('stroke', left===0?'#E38884':'#E0B75B'); };
  tick(); clearInterval(clockTimer); clockTimer=setInterval(tick,1000);
}

  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="seclabel">${label}${open.length?' · '+open.length+' to do':''}</span></div><div style="margin-top:10px;border:1px solid #EFE8D6;border-radius:12px">${hw.map(h=>`<div class="att"><span style="flex:1;min-width:0"><b style="display:block;font-size:15.5px">${esc(h.title)}</b>${(h.parts||[]).length?`<span style="display:block;font-size:13.5px;color:var(--navy2);margin-top:2px">${esc(hwPartsText(h))}</span>`:''}<span style="font-size:13.5px;color:var(--soft)">${[h.due?'Due '+esc(h.due):'',h.note?esc(h.note):''].filter(Boolean).join(' · ')}</span></span>${h.done?'<span class="pill p-ok">Done</span>':h.overdue?'<span class="pill p-bad">Overdue</span>':h.due?`<span class="pill p-info">${esc(dueText(h.due))}</span>`:''}${h.done?'':`<button class="btn sm" data-openhw="${esc(h.id)}" data-item="${esc(h.item)}" type="button">Start</button>`}</div>`).join('')}</div></div>`; }
function mm(n){ return n>=60?Math.floor(n/60)+' h'+(n%60?' '+n%60+' min':''):n+' min'; }
function classRecordCard(){ const r=D.classRecord; if(!r||!r.total) return notesCard();
  return `<div class="card"><span class="seclabel">My classes</span><div class="row" style="gap:26px;margin:10px 0 12px"><div class="stat"><b>${r.thisMonth}</b><span>in ${esc(r.monthLabel)}${r.thisMonthMins?' · '+mm(r.thisMonthMins):''}</span></div><div class="stat"><b>${r.lastMonth}</b><span>last month</span></div><div class="stat"><b>${r.total}</b><span>in total${r.totalMins?' · '+mm(r.totalMins):''}</span></div></div>
   <div style="border:1px solid #EFE8D6;border-radius:12px">${r.list.slice(0,8).map(c=>`<div class="att"><span class="mono" style="font-size:13px;color:var(--soft);min-width:150px">${esc(fmtWhen(c.start))}</span><span style="flex:1;min-width:0;font-size:14.5px;white-space:pre-line">${c.notes?esc(c.notes):'<span style="color:var(--soft)">No notes</span>'}</span><span class="pill p-mute">${c.mins?c.mins+' min':'–'}</span></div>`).join('')}</div></div>`; }
function notesCard(){ const n=D.notes||[]; if(!n.length) return '';
  return `<div class="card"><span class="seclabel">Notes from your classes</span><div style="margin-top:10px;display:flex;flex-direction:column;gap:10px">${n.map(x=>`<div style="border-left:3px solid var(--gold);padding:4px 12px"><span style="font-size:13px;color:var(--soft)">${esc(fmtWhen(x.start))}</span><div style="font-size:15px;line-height:1.5;white-space:pre-line">${esc(x.notes)}</div></div>`).join('')}</div></div>`; }
function doubtsCard(){ const d=D.doubts||[];
  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="seclabel">My doubts</span><button class="btn ghost sm" data-ask="" type="button">Ask a doubt</button></div>${d.length?`<div style="margin-top:10px;border:1px solid #EFE8D6;border-radius:12px">${d.map(x=>`<div class="att"><span style="flex:1;min-width:0"><b style="display:block;font-size:15px">${esc(x.question)}</b><span style="font-size:13px;color:var(--soft)">${x.title?esc(x.title)+' · ':''}${x.asked?new Date(x.asked).toLocaleDateString():''}</span>${x.answer?`<div style="margin-top:6px;font-size:14.5px;background:var(--okbg);color:#1F4F33;border-radius:8px;padding:8px 10px">${esc(x.answer)}</div>`:''}</span>${x.status==='Open'?'<span class="pill p-gold">Waiting</span>':'<span class="pill p-ok">Answered</span>'}</div>`).join('')}</div>`:'<p style="color:var(--soft);font-size:14.5px;margin:8px 0 0">Stuck on something? Ask here or from inside a sheet. Your teacher will answer, often in your next class.</p>'}</div>`; }
function askBox(item,title){ const d=document.createElement('div'); d.className='confirm'; d.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="akt"><h2 id="akt" style="font-size:22px">Ask your teacher</h2><p style="color:var(--soft);margin:6px 0 0">${title?'About: '+esc(title):'Any question about your program'}</p><label class="l" for="akq">Your question</label><textarea class="f" id="akq" rows="4" placeholder="e.g. I don't understand question 4 in practice set 2"></textarea><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" type="button" data-no>Cancel</button><button class="btn" type="button" data-yes>Send</button></div></div>`;
  document.body.appendChild(d); d.querySelector('#akq').focus(); d.querySelector('[data-no]').onclick=()=>d.remove();
  d.querySelector('[data-yes]').onclick=async()=>{ const q=d.querySelector('#akq').value.trim(); if(q.length<3){ toast('Type your question.'); return; } const j=await api('askDoubt',{item:item||'',question:q}); d.remove(); toast(j.ok?'Sent to your teacher.':j.msg); if(j.ok) refresh(); }; }
function timetableCard(){
  const nx=D.next||[], sl=D.slots||[], s=D.student; if(!nx.length&&!sl.length) return '';
  const first=nx[0];
  return `<div class="card" style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start"><div style="flex:1 1 100%;display:flex;justify-content:flex-end">${zoneSwitch()}</div><div style="flex:1 1 260px"><span style="font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--goldtx);font-weight:700">Next class (${esc(vzLabel())})</span>
   ${first?`<h2 style="font-size:26px;margin-top:4px">${esc(fmtWhen(first.start))}</h2><span class="pill p-info" style="margin-top:6px">${esc(rel(first.start))}</span><span style="color:var(--soft);font-size:14.5px;margin-left:8px">${first.minutes} min${first.tz&&first.tz!==VIEWZ?' · class time '+esc(inZone(first.start,first.tz)):''}${first.note?' · '+esc(first.note):''}</span>`:'<p style="color:var(--soft)">No upcoming class in the next 30 days.</p>'}</div>
   <div style="flex:2 1 320px"><span style="font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--goldtx);font-weight:700">Coming up</span>
   <div style="margin-top:8px;border:1px solid #EFE8D6;border-radius:10px">${nx.slice(0,6).map(o=>`<div class="row" style="justify-content:space-between;padding:9px 12px;border-bottom:1px solid #EFE8D6"><span>${esc(fmtWhen(o.start))}</span><span style="color:var(--soft);font-size:14px">${o.minutes} min${o.tz&&o.tz!==VIEWZ?' · '+esc(inZone(o.start,o.tz)):''}${o.note?' · '+esc(o.note):''}</span></div>`).join('')||'<div style="padding:10px;color:var(--soft)">Nothing scheduled yet.</div>'}</div>
   ${sl.length?`<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">${sl.map(x=>{ const g=gcal(x,'Sopaan class · '+s.progName,'With '+(s.teacherName||'your teacher')+(s.meet?'\nGoogle Meet: '+s.meet:'')); return `<div class="row" style="justify-content:space-between;gap:8px"><span style="font-size:14.5px">${esc(slotText(x))}</span>${g?`<a class="btn ghost sm" href="${esc(g)}" target="_blank" rel="noopener">Add to Google Calendar</a>`:''}</div>`; }).join('')}</div>`:''}</div></div>`;
}
async function openSheet(id,hw){
  document.getElementById('modal').innerHTML=`<div class="sheetwrap">${loading()}</div>`;
  const j=await api('open',hw?{item:id,hw}:{item:id});
  if(!j.ok){ document.getElementById('modal').innerHTML=''; toast(j.msg); refresh(); return; }
  document.getElementById('modal').innerHTML=`<div class="sheetwrap" role="dialog" aria-label="${esc(j.item.title)}"><div class="sheetbar"><b>${esc(j.item.title)}</b>${(j.item.parts||[]).length?`<span style="font-size:13.5px;color:#CFD7EA">${esc(j.item.parts.map(p=>p.name).join(' · '))}</span>`:''}<span style="flex:1"></span><button class="btn ghost sm" id="sask" type="button">I'm stuck</button><button class="btn ghost sm" id="sclose" type="button">Save and close</button><button class="btn gold sm" id="sfin" type="button">I'm finished</button></div><iframe id="sframe" title="${esc(j.item.title)}"></iframe></div>`;
  document.getElementById('sframe').srcdoc=j.html;
  document.getElementById('sask').onclick=()=>askBox(id,j.item.title);
  document.getElementById('sclose').onclick=()=>{ document.getElementById('modal').innerHTML=''; refresh(); };
  document.getElementById('sfin').onclick=()=>confirmBox('Finish this sheet?',(j.item.parts||[]).length?'After you finish, these parts are locked for you. Only your teacher can open them again.':'After you finish, this sheet is locked for you. Only your teacher can open it again.','Yes, I\'m finished',async()=>{ const f=await api('finish',hw?{item:id,hw}:{item:id}); document.getElementById('modal').innerHTML=''; toast(f.ok?'Well done! This sheet is now finished.':f.msg); refresh(); });
}
function confirmBox(title,text,ok,fn){ const d=document.createElement('div'); d.className='confirm'; d.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="cft"><h2 id="cft" style="font-size:22px">${esc(title)}</h2><p style="color:var(--soft);line-height:1.5">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" type="button" data-no>Cancel</button><button class="btn" type="button" data-yes>${esc(ok)}</button></div></div>`; document.body.appendChild(d); d.querySelector('[data-no]').onclick=()=>d.remove(); d.querySelector('[data-yes]').onclick=()=>{ d.remove(); fn(); }; }

  const body= view.tab==='teachers'?aTeachers(): view.tab==='students'?studentsTab(kind): view.tab==='enrol'?enrolTab(kind): view.tab==='addprog'?addProgTab(): view.tab==='classes'?classLog(): view.tab==='calendar'?calendarTab(kind): view.tab==='home'?homeTab(kind): view.tab==='referrals'?referralsTab(): view.tab==='doubts'?doubtsTab(): view.tab==='notices'?noticesTab(kind): mapTab();

function studentsTab(kind){

    return `<tr ${sel===x.id?'style="background:#FBF7EC"':''}><td><b>${esc(x.name||'(no name)')}</b><br><span class="mono" style="font-size:12.5px;color:var(--soft)">${esc(x.id)}</span></td>${kind==='admin'?`<td>${esc(tname(x.teacher))}</td>`:''}<td>${(x.progs||[]).length?x.progs.map(p=>esc(pname(p))).join('<br>'):'<span style="color:var(--soft)">Not enrolled</span>'}</td><td class="mono">${x.prog?x.done+' / '+x.total:'—'}</td><td class="mono">${x.devices.length} / 3</td><td style="font-size:14px;white-space:nowrap">${x.next?esc(fmtWhen(x.next.start))+'<br><span style="color:var(--soft)">'+esc(rel(x.next.start))+'</span>':'<span style="color:var(--soft)">—</span>'}</td><td>${status}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap">${classButtons(x,kind,x.live)}<button class="btn ghost sm" data-sel="${esc(x.id)}" type="button">Edit</button></div></td></tr>`; }).join('');

function progOptions(cur){ return GROUPS.map(g=>{ const ps=(D.programs||[]).filter(p=>p.group===g); return ps.length?`<optgroup label="${g}">${ps.map(p=>`<option value="${esc(p.id)}" ${p.id===cur?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup>`:''; }).join('')+(cur&&!P(cur)?`<option value="${esc(cur)}" selected>${esc(cur)} (not in your programs)</option>`:''); }
function progChecks(s){ const mine=new Set((D.programs||[]).map(p=>p.id)), cur=new Set(s.progs||[]);
  const list=[...(D.programs||[])].concat([...cur].filter(p=>!mine.has(p)).map(p=>({id:p,name:p+' (not given to you)',locked:true})));
  return `<div style="border:1px solid #E4DCC8;border-radius:10px;max-height:190px;overflow:auto;padding:4px 8px">${list.map(p=>`<label style="display:flex;gap:8px;align-items:center;padding:5px 0;font-size:14.5px"><input type="checkbox" data-eprog="${esc(p.id)}" ${cur.has(p.id)?'checked':''} ${p.locked?'disabled':''} style="width:17px;height:17px;accent-color:var(--navy2)">${esc(p.name)}</label>`).join('')||'<span style="color:var(--soft);font-size:14px">No programs have been given to you yet.</span>'}</div>`; }
function slotLocal(x,tz){ if(!tz||tz==='IST'||!x.nextStart) return ''; const d=new Date(x.nextStart); const o={timeZone:ZONES[tz]};

  on('[data-act=copyslips]',()=>{ const t=slips.map(x=>`${x.name}\nLogin ID: ${x.id}   PIN: ${x.pin}\nPrograms: ${(x.progs||[x.prog]).map(pname).join(', ')}\n`).join('\n'); try{ navigator.clipboard.writeText(t).then(()=>toast('Slips copied.'),()=>toast('Copy was blocked.')); }catch(e){ toast('Copy was blocked.'); } });
  app.querySelectorAll('[data-tsel]').forEach(b=>b.onclick=()=>{ selT=b.dataset.tsel||null; render(); });
  app.querySelectorAll('[data-tgall]').forEach(b=>b.onclick=()=>{ app.querySelectorAll(`[data-tprog][data-g="${b.dataset.tgall}"]`).forEach(c=>c.checked=true); });
  on('[data-act=savetp]',async()=>{ const progs=[...app.querySelectorAll('[data-tprog]')].filter(c=>c.checked).map(c=>c.dataset.tprog); done(await api('setTeacherPrograms',{tid:selT,progs}),'Programs saved.'); });
  on('[data-act=tpause]',async()=>{ const T=D.teachers.find(t=>t.id===selT); done(await api('saveTeacher',{tid:selT,status:T.status==='Active'?'Paused':'Active'})); });
  on('[data-act=tpw]',async()=>{ const pw='sop-'+Math.random().toString(36).slice(2,8); const j=await api('saveTeacher',{tid:selT,password:pw}); done(j,j.ok?'New password for '+selT+': '+pw:''); });
  const ta=$('#tadd'); if(ta) ta.onsubmit=async e=>{ e.preventDefault(); const j=await api('saveTeacher',{name:$('#tn').value,email:$('#te').value,password:$('#tp').value}); if(j.ok) selT=j.teacher.id; done(j,j.ok?'Teacher added. Now give them programs.':''); };
  const pa=$('#padd'); if(pa) pa.onsubmit=async e=>{ e.preventDefault(); const items=$('#prows').value.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const [title,link,type,section]=l.split('|').map(x=>(x||'').trim()); return {title,link,type,section}; });
    const j=await api('addProgram',{id:$('#pid').value,name:$('#pname').value,group:$('#pgrp').value,board:$('#pboard').value,notes:$('#pnote').value,items});
    if(j.ok){ toast('Program added with '+j.added+' items. Import its files from the Google Sheet menu.'); view.tab='teachers'; refresh(); } else $('#perr').innerHTML='<div class="err">'+esc(j.msg)+'</div>'; };
}

/* ================= START ================= */
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
render();
if(!REF) (async()=>{ const j=await api('catalog'); if(j.ok){ catalog=j.programs; if(view.page==='home') render(); } })();
if(token&&!REF){ refresh().then(startPolling); }
</script>
</body>
</html>
