<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sopaan · Variables on Both Sides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0} img{max-width:100%} [hidden]{display:none !important}
:root{
  --navy:#16264A; --navy-2:#1F3B6B; --gold:#C79A3E; --gold-soft:#F3E7C9;
  --paper:#FBF9F4; --paper-2:#F1EAD8; --card:#FFFFFF;
  --ink:#211E1A; --ink-soft:#655D4C; --rule:#E4DCC8;
  --success:#2E8B57; --success-soft:#E1F2E7;
  --danger:#BF4B45; --danger-soft:#FAE3E1;
  --locked:#C7BEA9; --focus:#1F3B6B;
  --accent-text:#1F3B6B; --retry-text:#8A661F;
  --sh-a:#1F3B6B; --sh-b:#C79A3E; --sh-c:#2E8B57; --sh-d:#BF4B45; --sh-water:#3B7DD8; --sh-land:#8A6A3B;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
  --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
  --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
  --success:#7BC79A; --success-soft:#1B2E22;
  --danger:#E38884; --danger-soft:#331D1B;
  --locked:#4A4436; --focus:#E0B75B;
  --accent-text:#E0B75B; --retry-text:#E0B75B;
  --sh-a:#8FB0EA; --sh-b:#E0B75B; --sh-c:#7BC79A; --sh-d:#E38884; --sh-water:#6AA6F0; --sh-land:#C9A46A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
  --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
  --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
  --success:#7BC79A; --success-soft:#1B2E22;
  --danger:#E38884; --danger-soft:#331D1B;
  --locked:#4A4436; --focus:#E0B75B;
  --accent-text:#E0B75B; --retry-text:#E0B75B;
  --sh-a:#8FB0EA; --sh-b:#E0B75B; --sh-c:#7BC79A; --sh-d:#E38884; --sh-water:#6AA6F0; --sh-land:#C9A46A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.serif{font-family:Fraunces,Georgia,serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}

/* header */
.hdr{background:linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 100%);color:#F4EFDF;padding:calc(14px + env(safe-area-inset-top)) 0 16px}
.brand{display:flex;align-items:center;gap:12px}
.crest{text-decoration:none;width:42px;height:42px;border-radius:10px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;border:0;flex:none}
.bma{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:700}
.sop{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:700}
.sop span{font-family:"Source Sans 3",sans-serif;font-size:14px;font-weight:400;color:#CFD7EA}
.clock{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:13px;color:#CFD7EA;background:rgba(255,255,255,.1);border-radius:999px;padding:4px 10px}
.eyebrow{margin-top:14px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#AEB9D6}
.title{font-family:Fraunces,Georgia,serif;font-size:28px;line-height:1.2;margin:4px 0 2px}
.subtitle{font-size:14.5px;color:var(--gold);font-weight:700}
.cprog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:#CFD7EA}
.track{flex:1;height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:13.5px}
.pill{border:0;border-radius:999px;padding:8px 14px;min-height:40px;font-weight:700;font-size:13.5px}
.pill.gold{background:var(--gold);color:var(--navy)}
.pill.ghost{background:rgba(255,255,255,.12);color:#F4EFDF}
.who{color:#CFD7EA;margin-right:auto}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--rule)}
.tabrow{display:flex;overflow-x:auto;scrollbar-width:none;max-width:900px;margin:0 auto;padding:0 8px}
.tabrow::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 9px;min-height:48px;font-weight:600;font-size:14.5px;color:var(--ink-soft);white-space:nowrap}
.tab small{display:inline-block;margin-left:5px;font-size:11px;background:var(--paper-2);border-radius:999px;padding:1px 7px;color:var(--ink-soft)}
.tab.on{color:var(--accent-text);border-bottom-color:var(--gold)}
.tab.lock{color:var(--locked)}
.tab.lvl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);padding:12px 4px 9px 14px;pointer-events:none}
.tabdesc{max-width:900px;margin:0 auto;padding:6px 16px 8px;font-size:13.5px;color:var(--ink-soft)}

/* main */
main{padding:16px 0 150px}
.sprog{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-soft);margin-bottom:6px}
.sprog .track{background:var(--paper-2);height:5px}
.meter{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin:0 0 12px}
.meter b{color:var(--ink)}
.meter .g{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--paper-2);vertical-align:middle;margin-left:6px;overflow:hidden}
.meter .g i{display:block;height:100%;background:var(--success)}
.hint{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:14.5px;margin-bottom:12px}
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qnum{flex:none;width:32px;height:32px;border-radius:8px;background:var(--gold-soft);color:var(--accent-text);font-family:Fraunces,Georgia,serif;font-weight:700;display:flex;align-items:center;justify-content:center}
.qtext{flex:1;font-size:21px;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0 44px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:3px 8px}
.tag.std{color:var(--accent-text)}
.casebody{margin:12px 0 0 44px;padding:12px 14px;background:var(--paper-2);border-radius:10px;font-size:18.5px}
.fig{margin:14px 0 0 44px}
.fig svg{max-width:100%;height:auto}
.fig table{border-collapse:collapse;font-size:17px}
.fig td,.fig th{border:1px solid var(--rule);padding:6px 14px;text-align:left}
.fig th{background:var(--paper-2)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;min-height:48px;background:var(--card);font-size:19.5px;cursor:pointer;text-align:left;width:100%}
.opt input{width:20px;height:20px;accent-color:var(--navy-2);flex:none}
.opt .lt{font-weight:700;color:var(--ink-soft)}
.opt .otag{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt.sel{border-color:var(--navy-2);background:var(--gold-soft)}
.opt.ok{border-color:var(--success);background:var(--success-soft)}
.opt.bad{border-color:var(--danger);background:var(--danger-soft)}
.opt[aria-disabled="true"]{cursor:default}
.ar p{margin:10px 0 0;font-size:19.5px}
.arTag{display:inline-block;font-size:11px;font-weight:700;background:var(--navy-2);color:#fff;border-radius:6px;padding:2px 7px;margin-left:44px}
.steps{margin-top:14px}
.step{border:1.5px dashed var(--rule);border-radius:10px;padding:10px 14px;margin-top:10px;line-height:1.9;font-size:19.5px}
.step.cur{border-color:var(--gold)}
.step.done{border-style:solid;border-color:var(--success)}
.step.rev{border-style:solid;border-color:var(--danger)}
.step.wait{opacity:.45}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--accent-text);background:var(--gold-soft);border-radius:6px;padding:1px 7px;margin-right:8px;vertical-align:2px}
.plabel{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-text)}
.bl{width:120px;font-family:"IBM Plex Mono",monospace;font-size:18px;border:1.5px solid var(--rule);border-radius:6px;padding:3px 8px;background:var(--paper);min-height:36px}
.bl:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.bl.ok{border-color:var(--success);background:var(--success-soft)}
sup .bl{width:64px;font-size:15px;min-height:30px;padding:2px 6px;vertical-align:super}
sup .pbl{width:40px}
.bl.bad{border-color:var(--danger);background:var(--danger-soft)}
.reveal{display:inline-block;font-size:14px;color:var(--danger);font-weight:600;margin-left:6px}
.keys{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.keys button{min-width:44px;min-height:40px;border:1px solid var(--rule);background:var(--paper-2);border-radius:8px;font-family:"IBM Plex Mono",monospace;font-weight:600}
.fb{margin-top:14px;border-radius:10px;padding:10px 14px;font-size:16px}
.fb.ok{background:var(--success-soft);color:var(--success);font-weight:600}
.fb.retry{background:var(--gold-soft);color:var(--retry-text);font-weight:600}
.fb.rev,.fb.err{background:var(--danger-soft);color:var(--danger);font-weight:600}
.dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--locked)}
.dots i.u{background:var(--retry-text)}
.ans{margin-top:12px;font-size:15.5px}
.sol{margin-top:14px;background:var(--paper-2);border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px}
.sol h4{margin:0 0 6px;font-family:Fraunces,Georgia,serif;color:var(--accent-text);font-size:16px}
.sol p{margin:4px 0;font-size:17px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--rule);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.navin{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:center}
.nb{min-height:44px;border-radius:10px;border:1px solid var(--rule);background:var(--card);padding:0 14px;font-weight:600;font-size:15px}
.nb.pri{background:var(--navy-2);color:#fff;border-color:var(--navy-2)}
.nb.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.nb:disabled{opacity:.4;cursor:not-allowed}
.sp{flex:1}
.fabs{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:31;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab{border:0;border-radius:999px;min-height:44px;padding:0 16px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.fab.q{background:var(--gold);color:var(--navy)}
.fab.t{background:var(--card);color:var(--ink);border:1px solid var(--rule);width:44px;padding:0}
.fab .bdg{background:var(--navy);color:#fff;border-radius:999px;padding:1px 7px;margin-left:6px;font-size:12px}

/* overlay / dialog */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,12,20,.5);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){.ov{align-items:center}.dlg{max-width:620px;border-radius:16px}}
.dlg h3{margin:0 0 10px;font-family:Fraunces,Georgia,serif}
.dlgx{float:right;border:0;background:var(--paper-2);border-radius:8px;min-width:40px;min-height:40px;font-size:18px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin:12px 0}
.chip{min-height:44px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);font-family:"IBM Plex Mono",monospace;font-weight:600}
.chip.cur{border-color:var(--navy-2);box-shadow:0 0 0 2px var(--gold)}
.chip.correct{background:var(--success-soft);border-color:var(--success)}
.chip.revealed{background:var(--danger-soft);border-color:var(--danger)}
.chip.skipped{background:var(--paper-2);border-style:dashed}
.chip.answered{background:var(--gold-soft)}
.chip.locked{color:var(--locked);background:var(--paper)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--rule)}
.legend .lc::before{border-color:var(--navy-2)} .legend .lk::before{background:var(--success-soft);border-color:var(--success)}
.legend .lr::before{background:var(--danger-soft);border-color:var(--danger)} .legend .ls::before{border-style:dashed}
.legend .ll::before{background:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;max-width:90vw;text-align:center}

/* cards: sign in, theory, results */
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-family:Fraunces,Georgia,serif;font-size:22px}
.card h3{font-family:Fraunces,Georgia,serif;margin:18px 0 6px;font-size:19px;color:var(--accent-text)}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.field input{width:100%;min-height:44px;border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--paper);font-size:17px}
.note{font-size:13.5px;color:var(--ink-soft)}
.recent{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.recent button{min-height:40px;border:1px solid var(--rule);background:var(--paper-2);border-radius:999px;padding:0 12px}
.btn{min-height:44px;border:0;border-radius:10px;padding:0 18px;font-weight:700;background:var(--navy-2);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.line{background:none;border:1.5px solid var(--rule);color:var(--ink)}
.err{color:var(--danger);font-weight:600;font-size:14.5px;min-height:20px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.hcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px;text-align:left;width:100%}
.hcard b{display:block;font-family:Fraunces,Georgia,serif;font-size:17px;margin-bottom:4px}
.hcard span{font-size:14px;color:var(--ink-soft)}
.path{display:flex;gap:8px;flex-wrap:wrap}
.lv{flex:1;min-width:150px;border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;font-size:14px}
.lv b{display:block;font-size:15px}
.lv.pass{border-color:var(--success);background:var(--success-soft)}
.lv.open{border-color:var(--gold)}
.lv.lock{color:var(--locked)}
.theory p,.theory li{font-size:18.5px}
.forms{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.forms span{font-family:"IBM Plex Mono",monospace;font-size:22px;background:var(--gold-soft);border-radius:8px;padding:4px 14px}
.explorer{border:1.5px solid var(--gold);border-radius:12px;padding:14px;margin:14px 0;background:var(--paper)}
.explorer label{display:flex;align-items:center;gap:10px;font-weight:600;margin:6px 0;font-size:16px}
.explorer input[type=range]{flex:1;accent-color:var(--navy-2);min-height:32px}
.explorer .out{margin-top:10px;font-size:18px}
.explorer .out div{margin:4px 0}
.ex{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin:10px 0}
.ex ol{margin:8px 0 0;padding-left:22px}
.chk{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin:10px 0}
.chk .opts{margin-top:10px}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat span{border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;background:var(--paper-2)}
.stat .k{background:var(--success-soft);color:var(--success)} .stat .r{background:var(--danger-soft);color:var(--danger)} .stat .s2{background:var(--gold-soft);color:var(--retry-text)}
.congrats{text-align:center}
.congrats .big{font-family:Fraunces,Georgia,serif;font-size:26px;margin:6px 0}
.obs{text-align:left;margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
.obs h4{margin:10px 0 4px;font-family:Fraunces,Georgia,serif;color:var(--accent-text)}
.obs ul{margin:4px 0;padding-left:20px}
.obs li{margin:3px 0}
.rv{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin:8px 0}
.rv .st{font-size:12px;font-weight:700;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-right:6px}
.rv .st.c{background:var(--success-soft);color:var(--success)} .rv .st.w{background:var(--danger-soft);color:var(--danger)} .rv .st.n{background:var(--paper-2);color:var(--ink-soft)}
.rv button{margin-top:6px}
table.rec{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
table.rec th,table.rec td{border:1px solid var(--rule);padding:5px 6px;text-align:center}
table.rec th:first-child,table.rec td:first-child{text-align:left}
table.rec th{background:var(--paper-2)}
.mini{font-size:13px;min-height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--rule);background:var(--paper-2);font-weight:600}
footer{text-align:center;font-size:12px;color:var(--ink-soft);padding:20px 16px 0}
/* tools */
.pad{position:fixed;inset:0;z-index:55;background:rgba(255,255,255,.04);display:flex;flex-direction:column}
.padbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px calc(8px + env(safe-area-inset-right)) 8px 8px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--rule);align-items:center}
.padbar button{min-width:44px;min-height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--card);font-weight:600}
.padbar button.on{border-color:var(--navy-2);box-shadow:0 0 0 2px var(--gold)}
.pad canvas{flex:1;touch-action:none;background:rgba(251,249,244,.15)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc button{min-height:48px;border-radius:10px;border:1px solid var(--rule);background:var(--paper-2);font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600}
.calc .eq{background:var(--navy-2);color:#fff}
.cdisp{font-family:"IBM Plex Mono",monospace;font-size:24px;text-align:right;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px;margin-bottom:10px;min-height:56px;word-break:break-all}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (max-width:420px){.fig table{font-size:16px}.fig td,.fig th{padding:6px 8px}.qtext{font-size:19px}.opt,.step{font-size:18px}.fig,.tags,.casebody{margin-left:0}.arTag{margin-left:0}.title{font-size:24px}.clock{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
.tag{text-transform:uppercase}
.brief h3{margin-top:16px}
.mistake{border-color:var(--danger);background:var(--danger-soft)}
.mistake p{margin:4px 0}
.sprog .mini{flex:none}
.trow{display:flex;align-items:center;gap:8px;margin-top:8px}
.tlab{flex:none;width:76px;font-size:14px;font-weight:600}
.tbar{display:flex;flex:1;flex-wrap:wrap;gap:3px}

/* ---------- learn / practice checking ---------- */
function readInputs(s) {
  s.vals = s.vals || {};
  Array.prototype.forEach.call(document.querySelectorAll("#main .bl:not([disabled])"), function (el) { s.vals[el.getAttribute("data-k")] = el.value; });
}
function doCheck() {
  var t = tabById(CUR), p = pos(t), it = t.items[p], s = items(t)[p], key = t.id + ":" + p;
  if (isDone(s) && s.st !== "skipped") return;
  if (s.st === "skipped") s.st = "";
  if (it.type === "mcq" || it.type === "ar") {
    if (s.sel == null) { FB[key] = { cls: "err", msg: "Please choose an option first." }; return refresh(); }
    if (s.sel === it.a) { s.st = "correct"; FB[key] = { cls: "ok", msg: s.tries ? "Correct on your second try. Well done!" : "Correct! Well done." }; sndOk(); }
    else {
      s.tries = (s.tries || 0) + 1; s.miss = (s.miss || 0) + 1;

      if (s.tries < 2) { FB[key] = { cls: "retry", msg: "Not quite — try again (attempt 1 of 2)", tip: dg }; sndBad(); }
      else { s.st = "revealed"; FB[key] = { cls: "rev", msg: "The correct answer is (" + LETTERS[it.a] + ") " + optLabel(it, it.a) + ".", tip: dg }; sndRev(); }
    }

    bl.forEach(function (B) { var ok = match(s.vals[k + "_" + B], st, B); s.res[k + "_" + B] = ok ? "ok" : "bad"; if (!ok) allOk = false; });
    if (allOk) {
      s.step = k + 1; s.tries = 0;
      if (s.step >= it.steps.length) { s.st = s.rev.length ? "revealed" : "correct"; FB[key] = { cls: s.rev.length ? "rev" : "ok", msg: s.rev.length ? "Finished. Some steps were revealed — read the solution below." : (s.miss ? "All steps correct. Well done!" : "All steps correct first time. Excellent!") }; }
      else FB[key] = { cls: "ok", msg: "Step " + (k + 1) + " correct! Now step " + (k + 2) + "." };
      sndOk();
    } else {
      s.tries = (s.tries || 0) + 1; s.miss = (s.miss || 0) + 1;
      var tips = []; bl.forEach(function (B) { if (s.res[k + "_" + B] === "bad") { var d = diagBlank(s.vals[k + "_" + B], st, B); if (d && tips.indexOf(d) < 0) tips.push(d); } });
      if (s.tries < 2) { FB[key] = { cls: "retry", msg: "Not quite — try again (attempt 1 of 2)", tip: tips.join(" ") }; sndBad(); }
      else {

        s.step = k + 1; s.tries = 0;
        if (s.step >= it.steps.length) { s.st = "revealed"; msg += ". Read the solution below."; } else msg += ". Now step " + (k + 2) + ".";
        FB[key] = { cls: "rev", msg: msg, tip: tips.join(" ") }; sndRev();
      }
    }
  }
  save(); refresh();
  var f = document.querySelector("#main .bl:not([disabled])"); if (f && it.type === "steps" && !isDone(s)) { try { f.focus({ preventScroll: true }); } catch (e) {} }
}

/* ---------- navigation ---------- */

  renderHeader(); renderTabs();
  if (t.kind === "theory") renderTheory(); else renderQuestions();
}

/* ---------- events ---------- */
document.addEventListener("click", function (e) {
  ac();
  var b = e.target.closest("[data-act]"); if (!b) { if (e.target.id === "ov") closeDlg(); return; }
  var act = b.getAttribute("data-act"), t = tabById(CUR);
  switch (act) {
    case "signin": doSignIn(); break;
    case "recent": $("#inName").value = b.getAttribute("data-name"); $("#inRoll").value = b.getAttribute("data-roll"); $("#inPin").focus(); break;
    case "signout": readQuiz(); USER = null; P = null; closeDlg(); clearInterval(timerI); render(); window.scrollTo(0, 0); break;
    case "tab": {
      var nt = tabById(b.getAttribute("data-id")); closeDlg();
      if (!tabOpen(nt)) { toast("Pass the Stage " + (nt.level - 1) + " test (8 out of 10) to unlock Level " + nt.level + "."); break; }
      readQuiz(); CUR = nt.id; save(); render(); window.scrollTo(0, 0); break;
    }
    case "levelpill": readQuiz(); CUR = "l" + curLevel() + "-learn"; render(); window.scrollTo(0, 0); break;
    case "record": openRecord(); break;
    case "close": closeDlg(); TEST_CONFIRM = false; break;
    case "theme": {
      var r = document.documentElement, cur = r.getAttribute("data-theme"), dark = cur ? cur === "dark" : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      r.setAttribute("data-theme", dark ? "light" : "dark"); sset("sopaan-theme", dark ? "light" : "dark"); break;
    }
    case "scrollto": { var el = document.getElementById(b.getAttribute("data-to")); if (el) el.scrollIntoView({ behavior: "smooth" }); break; }
    case "exstep": { var i = b.getAttribute("data-i"); EXSTEP[i] = (EXSTEP[i] || 0) + 1; refresh(); break; }
    case "hint": { var hs = items(t)[pos(t)]; if (!hs.hint) { hs.hint = true; hs.miss = Math.max(1, hs.miss || 0); save(); refresh(); } break; }
    case "printdlg": openPrintDlg(); break;
    case "print": showPrint(+b.getAttribute("data-l"), b.getAttribute("data-k"), b.getAttribute("data-v") || "A", false); break;
    case "mistake": EXSTEP["m" + b.getAttribute("data-l")] = 1; refresh(); break;
    case "bcheck": { var bk = b.getAttribute("data-k"), bc = bchecks(); if (bc[bk] == null) { var parts = bk.split("-"), cq = LEVELS[+parts[0] - 1].brief.checks[+parts[1]]; bc[bk] = +b.getAttribute("data-j"); if (bc[bk] === cq.a) sndOk(); else sndBad(); save(); refresh(); } break; }
    case "briefstart": { var bt = b.getAttribute("data-id"); seen()[bt] = true; BRIEFV[bt] = false; save(); refresh(); window.scrollTo(0, 0); break; }
    case "openbrief": { readQuiz(); var ot = b.getAttribute("data-id"); CUR = ot; BRIEFV[ot] = true; save(); render(); window.scrollTo(0, 0); break; }
    case "check":
      if (b.hasAttribute("data-j")) { var ci = +b.getAttribute("data-i"); if (P.checks[ci] == null) { P.checks[ci] = +b.getAttribute("data-j"); if (P.checks[ci] === THEORY.checks[ci].a) sndOk(); else sndBad(); save(); renderTheory(); } }
      else doCheck();
      break;
    case "pick": {
      e.preventDefault();
      var s = items(t)[pos(t)]; if (!isQuiz(t) && isDone(s) && s.st !== "skipped") break;
      if (!isQuiz(t) && s.st === "skipped") s.st = "";
      s.sel = +b.getAttribute("data-j"); delete FB[t.id + ":" + pos(t)];
      if (isQuiz(t)) readInputs(s);
      save(); refresh(); break;
    }
    case "key": { var inp = LASTBL && document.body.contains(LASTBL) && !LASTBL.disabled ? LASTBL : document.querySelector("#main .bl:not([disabled])"); if (inp) { var v = b.getAttribute("data-v"), st0 = inp.selectionStart == null ? inp.value.length : inp.selectionStart, en = inp.selectionEnd == null ? st0 : inp.selectionEnd; inp.value = inp.value.slice(0, st0) + v + inp.value.slice(en); inp.focus(); try { inp.setSelectionRange(st0 + v.length, st0 + v.length); } catch (x) {} inp.dispatchEvent(new Event("input", { bubbles: true })); } break; }
    case "prev": readQuiz(); go(Math.max(0, pos(t) - 1)); break;
    case "next": doNext(); break;
    case "skip": doSkip(); break;
    case "finishtest": TEST_CONFIRM = true; finishTest(); break;
    case "retake": retakeTest(); break;
    case "review": reviewLearn(); break;
    case "reset": resetSheet(); break;
    case "goq": P.pos[t.id] = +b.getAttribute("data-i"); save(); render(); window.scrollTo(0, 0); break;
    case "togsol": { var d = document.getElementById("rs" + b.getAttribute("data-i")); d.hidden = !d.hidden; b.textContent = d.hidden ? "Show solution" : "Hide solution"; break; }
    case "palette": openPalette(); break;
    case "chip": {
      var ii = +b.getAttribute("data-i");
      readQuiz(); closeDlg(); go(ii); break;
    }
    case "pad": openPad(); break;
    case "calc": openCalc(); break;
    case "ck": calcKey(b.getAttribute("data-v")); break;
  }
});
var LASTBL = null;
document.addEventListener("focusin", function (e) { if (e.target.classList && e.target.classList.contains("bl")) LASTBL = e.target; });
document.addEventListener("input", function (e) {
  var el = e.target;
  if (el.classList && el.classList.contains("bl") && USER) {
    var t = tabById(CUR), s = items(t)[pos(t)]; s.vals = s.vals || {}; s.vals[el.getAttribute("data-k")] = el.value;
    if (el.classList.contains("bad")) { el.classList.remove("bad"); }
    if (isQuiz(t)) { save(); var b = $("#fabQ .bdg"); if (b) b.textContent = items(t).filter(answeredQuiz).length + "/" + t.items.length; }
  }
  if (el.getAttribute && el.getAttribute("data-tl")) {
    var tk2 = el.getAttribute("data-tl"); TL[tk2] = +el.value;
    var tw2 = document.getElementById("tltool"); if (tw2) { var tmp4 = document.createElement("div"); tmp4.innerHTML = toolHTML(); var nw4 = tmp4.firstChild; tw2.parentNode.replaceChild(nw4, tw2); var f4 = nw4.querySelector("[data-tl='" + tk2 + "']"); if (f4) f4.focus(); }
  }
  if (el.getAttribute && (el.getAttribute("data-rt") || el.getAttribute("data-ur"))) {
    var isRt = !!el.getAttribute("data-rt"), kk = el.getAttribute(isRt ? "data-rt" : "data-ur");
    (isRt ? RT : UR)[kk] = +el.value;
    var tl = document.getElementById(isRt ? "rtool" : "utool");
    if (tl) { var tmp3 = document.createElement("div"); tmp3.innerHTML = isRt ? rtHTML() : urHTML(); var nw3 = tmp3.firstChild; tl.parentNode.replaceChild(nw3, tl); var f3 = nw3.querySelector("[data-" + (isRt ? "rt" : "ur") + "='" + kk + "']"); if (f3) f3.focus(); }
  }
  if (el.getAttribute && el.getAttribute("data-tape")) {
    var ln = +el.getAttribute("data-l"), tk = el.getAttribute("data-tape"), td = TAPE[ln]; td[tk] = +el.value;
    if (tk !== "total") { var pp = td.a + td.b; td.total = Math.max(pp, Math.round(td.total / pp) * pp); }
    var tw = document.getElementById("tape" + ln); if (tw) { var tmp2 = document.createElement("div"); tmp2.innerHTML = tapeHTML(ln); var nw2 = tmp2.firstChild; tw.parentNode.replaceChild(nw2, tw); var f2 = nw2.querySelector("[data-tape='" + tk + "']"); if (f2) f2.focus(); }
  }
  if (el.getAttribute && el.getAttribute("data-exp")) {
    var k = el.getAttribute("data-exp"); if (k === "g") EXP.g = el.checked; else EXP[k] = +el.value;
    var ex = $("#explorer"); if (ex) { var tmp = document.createElement("div"); tmp.innerHTML = explorerHTML(); var nw = tmp.firstChild; ex.parentNode.replaceChild(nw, ex); var f = nw.querySelector("[data-exp='" + k + "']"); if (f) f.focus(); }
  }
});
document.addEventListener("change", function (e) { if (e.target.getAttribute && e.target.getAttribute("data-exp") === "g") { var ev = new Event("input", { bubbles: true }); e.target.dispatchEvent(ev); } });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { if (!$("#ov").hidden) closeDlg(); else if (!$("#pad").hidden) { $("#pad").hidden = true; $("#pad").innerHTML = ""; } }
  if (e.key === "Enter" && USER) {
    if (e.target.classList && e.target.classList.contains("bl")) { var t = tabById(CUR); e.preventDefault(); if (isQuiz(t)) doNext(); else { var s = items(t)[pos(t)]; if (isDone(s) && s.st !== "skipped") doNext(); else doCheck(); } }
  }
  if (e.key === "Enter" && !USER && e.target.id && /^in(Name|Roll|Pin)$/.test(e.target.id)) doSignIn();
});

/* ---------- boot ---------- */
(function boot() {
  var th = sget("sopaan-theme"); if (th) document.documentElement.setAttribute("data-theme", th);
  document.title = "Sopaan · " + (SHEET.isHub ? SHEET.chapter.title : SHEET.lo.title);
  $("#eyebrow").textContent = SHEET.series + " · " + lvName() + " " + SHEET.subject + " · Chapter " + SHEET.chapter.n + " of " + SHEET.chapter.total + (SHEET.isHub ? " · Chapter hub" : " · LO " + SHEET.lo.n + " of " + SHEET.lo.total);
  $("#title").textContent = SHEET.lo.title;
  $("#subtitle").textContent = SHEET.chapter.title + " · Standard " + SHEET.lo.std + (PREVIEW ? " · Teacher preview" : "");
  $("#foot").textContent = "Brain & Mind Academy · Sopaan Practice Series · " + SHEET.series + " · " + lvName() + " · Chapter " + SHEET.chapter.n + " of " + SHEET.chapter.total + " · LO " + SHEET.lo.code + ". Questions are original and aligned to the Common Core State Standards for Mathematics.";
  var pm = (location.hash || "").match(/^#print-(\d)-(ws|key|test|testkeys)(?:-([ABC]))?$/);
  if (pm) { document.documentElement.setAttribute("data-theme", "light"); showPrint(+pm[1], pm[2], pm[3] || "A", true); return; }
  setInterval(function () { var c = $("#clock"); if (c) c.textContent = USER ? "⏱ " + fmt(Date.now() - sessionStart()) : ""; }, 1000);
  render();
})();
})();

</script>
